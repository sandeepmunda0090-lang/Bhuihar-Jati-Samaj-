<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>रक्तदाता डायरेक्टरी | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--green:#168c50;--red:#d93025;--shadow:0 4px 16px rgba(20,42,72,0.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}

#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,0.1);padding-bottom:80px;}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px;border-radius:0 0 20px 20px;text-align:center;}
.header h1{margin:0;font-size:17px;font-weight:800}
.header p{margin:2px 0 0;font-size:11px;opacity:.85}

.container{padding:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:11.5px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.form-group select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px inherit;background:#f9fafb}

.donor-item{background:#fff5f5;border:1px solid #fecaca;border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;}
.donor-item p{margin:3px 0;}

.blood-badge{background:var(--red);color:#fff;font-size:14px;font-weight:800;padding:8px 12px;border-radius:10px;text-align:center;min-width:48px;}

/* पॉप-अप मोडल */
#restrictionModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;display:none;justify-content:center;align-items:center;padding:16px;}
.modal-content{background:var(--card);width:100%;max-width:320px;border-radius:16px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.modal-content h3{margin:0 0 8px;color:var(--navy);font-size:16px;}
.modal-content p{margin:0 0 16px;color:var(--muted);font-size:12.5px;line-height:1.4;}
.modal-btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px;width:100%;font:700 12.5px inherit;cursor:pointer;margin-bottom:6px;}
.modal-close{background:#e2e8f0;color:var(--text);border:0;border-radius:10px;padding:8px;width:100%;font:700 12px inherit;cursor:pointer;}

/* बॉटम नेविगेशन */
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>🩸 आपातकालीन रक्तदाता डायरेक्टरी</h1>
    <p>मानवता और समाज सेवा हेतु समर्पित</p>
  </div>

  <div class="container">
    
    <!-- फिल्टर बॉक्स -->
    <div class="card">
      <div class="form-group">
        <label>रक्त समूह (Blood Group) चुनें</label>
        <select id="bloodFilter" onchange="filterDonors()">
          <option value="">-- सभी रक्तदाता देखें --</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
    </div>

    <!-- रक्तदाता सूची -->
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:13.5px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:6px;">❤️ उपलब्ध रक्तदाता</h3>
      <div id="donorListContainer">
        <p style="font-size:12px;color:var(--muted);text-align:center;">रक्तदाता सूची लोड हो रही है...</p>
      </div>
    </div>

  </div>

  <!-- रेस्ट्रिक्शन पॉप-अप -->
  <div id="restrictionModal">
    <div class="modal-content">
      <h3>🔒 सुरक्षित जानकारी</h3>
      <p>आपातकालीन संपर्क के लिए पूरा नंबर देखने हेतु कृपया पहले लॉगिन करें।</p>
      <button class="modal-btn" onclick="window.location.href='login.html'">लॉगिन करें</button>
      <button class="modal-close" onclick="closeModal()">बंद करें</button>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html" class="active"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allDonors = [];
let isUserLoggedIn = false;

window.onload = function(){
  let savedMob = localStorage.getItem("userLoggedInMobile");
  if(savedMob) isUserLoggedIn = true;
  loadDonors();
}

async function loadDonors(){
  let container = document.getElementById("donorListContainer");
  try {
    let snap = await db.collection("users").where("status", "==", "approved").get();
    if(snap.empty){
      container.innerHTML = "<p style='font-size:12px;color:var(--muted);text-align:center;'>कोई सक्रिय सदस्य उपलब्ध नहीं है।</p>";
      return;
    }
    allDonors = [];
    snap.forEach(doc => {
      let data = doc.data();
      // केवल उन्हीं को लें जिनका ब्लड ग्रुप भरा हुआ है
      if(data.bloodGroup && data.bloodGroup.trim() !== ""){
        allDonors.push(data);
      }
    });
    renderDonorList(allDonors);
  } catch(err) {
    container.innerHTML = "<p style='font-size:12px;color:var(--red);text-align:center;'>डेटा लोड करने में त्रुटि।</p>";
  }
}

function renderDonorList(list){
  let container = document.getElementById("donorListContainer");
  container.innerHTML = "";

  if(list.length === 0){
    container.innerHTML = "<p style='font-size:12px;color:var(--muted);text-align:center;'>इस रक्त समूह का कोई डोनर उपलब्ध नहीं है।</p>";
    return;
  }

  list.forEach(d => {
    let div = document.createElement("div");
    div.className = "donor-item";

    let displayMob = d.mobile;
    let actionHTML = "";

    if(isUserLoggedIn){
      actionHTML = `<a href="tel:${d.mobile}" style="background:var(--green);color:#fff;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:11px;font-weight:700;display:inline-block;margin-top:4px;">📞 कॉल करें</a>`;
    } else {
      displayMob = d.mobile ? d.mobile.substring(0, 4) + "xxxxxx" : "xxxxxx";
      actionHTML = `<button onclick="showModal()" style="background:#e2e8f0;color:var(--navy);border:0;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;margin-top:4px;">🔒 नंबर देखें</button>`;
    }

    div.innerHTML = `
      <div>
        <p><b style="font-size:13px;color:var(--navy);">${d.fullName || '-'}</b></p>
        <p><b>गाँव/जिला:</b> ${d.village || '-'}, ${d.district || '-'}</p>
        <p><b>मोबाइल:</b> ${displayMob}</p>
        ${actionHTML}
      </div>
      <div>
        <div class="blood-badge">${d.bloodGroup}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

function filterDonors(){
  let selectedBlood = document.getElementById("bloodFilter").value;
  if(!selectedBlood){
    renderDonorList(allDonors);
    return;
  }
  let filtered = allDonors.filter(d => d.bloodGroup === selectedBlood);
  renderDonorList(filtered);
}

function showModal(){
  document.getElementById("restrictionModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("restrictionModal").style.display = "none";
}
</body>
</html>
