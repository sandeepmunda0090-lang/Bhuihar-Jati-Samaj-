<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <!-- हाई-रेजोल्यूशन और शार्प डिस्प्ले के लिए व्यूपोर्ट सेटिंग -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0757a3">
  <title>MPIN रीसेट करें | भुईहर जाति समाज</title>
  <style>
    :root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--shadow:0 8px 24px rgba(20,42,72,0.06)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      background:var(--bg);
      font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:16px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }

    /* ⭐ Page Premium Pop-up Animation ⭐ */
    @keyframes pagePop {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .box { 
      background: var(--card); 
      padding: 24px 20px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: var(--shadow); 
      border: 1px solid var(--line); 
      text-align: center; 
      animation: pagePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
    }

    /* SweetAlert2 को हमेशा सबसे ऊपर रखने के लिए */
    .swal2-container { z-index: 100000 !important; }

    h2 { color: var(--navy); font-size: 20px; margin-top: 0; margin-bottom: 6px; }
    p.sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; font: 13px inherit; background: #fafbfc; outline: none; }
    input:focus { border-color: var(--p); background: #fff; }
    button { background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff; border: none; padding: 12px; width: 100%; border-radius: 12px; cursor: pointer; font: 700 14px inherit; box-shadow: 0 4px 12px rgba(7,87,163,.2); margin-top: 10px; }
    button:active { transform: scale(0.98); }
    .back-link { display: inline-block; margin-top: 16px; font-size: 12.5px; color: var(--p); text-decoration: none; font-weight: 700; }
  </style>
  <!-- नया यूनीक पॉप-अप डिज़ाइन (SweetAlert2) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="box">
    <h2>🔑 MPIN रीसेट करें</h2>
    <p class="sub">पंजीकृत मोबाइल नंबर और जन्मतिथि दर्ज करके नया MPIN बनाएं[span_1](start_span)[span_1](end_span)</p>
    
    <div class="form-group">
      <label>पंजीकृत मोबाइल नंबर</label>
      <input type="tel" id="resetMob" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10">
    </div>
    
    <div class="form-group">
      <label>जन्मतिथि (Date of Birth)</label>
      <input type="date" id="resetDob">
    </div>

    <div class="form-group">
      <label>नया 6-डिजिट MPIN</label>
      <input type="password" id="newMpin" placeholder="नया MPIN दर्ज करें" maxlength="6">
    </div>

    <button onclick="resetMpinAction()">MPIN बदलें</button>
    <div>
      <a href="login.html" class="back-link">← लॉगिन पेज पर वापस जाएं</a>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function resetMpinAction() {
      let mob = document.getElementById("resetMob").value.trim();
      let dob = document.getElementById("resetDob").value;
      let newMpin = document.getElementById("newMpin").value.trim();

      if(!mob || !dob || !newMpin) {
        Swal.fire({ icon: 'warning', title: 'अधूरी जानकारी', text: 'कृपया सभी जानकारी (मोबाइल, जन्मतिथि और नया MPIN) भरें!', confirmButtonColor: '#0757a3' });
        return;
      }

      if(newMpin.length < 4) {
        Swal.fire({ icon: 'warning', title: 'अमान्य MPIN', text: 'नया MPIN कम से कम 4 से 6 अंकों का होना चाहिए!', confirmButtonColor: '#0757a3' });
        return;
      }

      try {
        let snapshot = await db.collection("users").where("mobile", "==", mob).where("dob", "==", dob).get();
        
        if(snapshot.empty) {
          Swal.fire({ icon: 'error', title: 'रिकॉर्ड नहीं मिला', text: 'दर्ज किया गया मोबाइल नंबर या जन्मतिथि रिकॉर्ड से मैच नहीं हो रहा है!', confirmButtonColor: '#dc2626' });
          return;
        }

        snapshot.forEach(async (doc) => {
          await db.collection("users").doc(doc.id).update({
            mpin: newMpin
          });
        });

        Swal.fire({
          icon: 'success',
          title: '✨ सफलता',
          text: 'आपका MPIN सफलतापूर्वक बदल दिया गया है! अब आप नए MPIN से लॉगिन कर सकते हैं।',
          confirmButtonColor: '#16a34a',
          confirmButtonText: 'लॉगिन करें'
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.href = "login.html";
          }
        });

      } catch(err) {
        Swal.fire({ icon: 'error', title: 'त्रुटि', text: err.message, confirmButtonColor: '#dc2626' });
      }
    }
  </script>
</body>
</html>
