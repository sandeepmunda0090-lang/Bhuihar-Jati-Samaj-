<meta name="description" content="Bhuihar Jati Samaj — Maharajganj Community Management Portal">
<meta name="theme-color" content="#16233D">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/4.4.4/chart.umd.min.js"></script>

<style>
/* =====================================================================
   BHUIHAR JATI SAMAJ — DESIGN SYSTEM
   Concept: "समाज रजिस्टर" — a living community register / civic ledger.
   Palette: sage-paper ground, ink-navy structure, marigold + maroon seal
   accents (dual-accent, not a single terracotta tone).
   Signature element: a circular rosette "seal" mark used as the emblem,
   watermark and section dividers — echoing an official registration stamp.
===================================================================== */
:root{
  --paper:#EFF1EA;
  --paper-raised:#F8F9F4;
  --ink:#16233D;
  --ink-soft:#3C4A63;
  --line:#DADFD2;
  --marigold:#E2900F;
  --marigold-dark:#B8720A;
  --maroon:#7A1E2E;
  --maroon-dark:#5E1521;
  --teal:#1F6E5C;
  --teal-soft:#E4F0EC;
  --danger:#B23A2E;
  --danger-soft:#F8E7E4;
  --gold-soft:#FBEDD2;
  --shadow-sm:0 1px 2px rgba(22,35,61,.06),0 1px 1px rgba(22,35,61,.04);
  --shadow-md:0 6px 20px -6px rgba(22,35,61,.18);
  --shadow-lg:0 20px 45px -12px rgba(22,35,61,.28);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
  --maxw:480px;
  --font-display:'Poppins',sans-serif;
  --font-hindi-display:'Tiro Devanagari Hindi',serif;
  --font-body:'Noto Sans','Noto Sans Devanagari',sans-serif;
  --font-mono:'Roboto Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(226,144,15,.06), transparent 40%),
    radial-gradient(circle at 88% 92%, rgba(122,30,46,.05), transparent 40%);
}
:focus-visible{outline:2.5px solid var(--marigold); outline-offset:2px; border-radius:4px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
h1,h2,h3,h4{font-family:var(--font-display); color:var(--ink); line-height:1.25;}
.hindi{font-family:var(--font-hindi-display);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#c9cebc; border-radius:8px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ---------- Layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.shell{
  width:100%; max-width:var(--maxw); margin:0 auto;
  padding:0 16px 96px; flex:1; position:relative;
}
@media (min-width:900px){
  .shell{max-width:1180px; padding:0 32px 48px; display:grid; grid-template-columns:250px 1fr; gap:32px;}
  .shell.no-sidebar{display:block; max-width:640px;}
}

/* ---------- Seal / signature mark ---------- */
.seal{
  --s:44px; width:var(--s); height:var(--s); border-radius:50%;
  background:conic-gradient(from 0deg, var(--marigold), var(--maroon) 25%, var(--marigold) 50%, var(--maroon) 75%, var(--marigold));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:var(--shadow-sm);
  position:relative;
}
.seal::before{
  content:''; position:absolute; inset:4px; border-radius:50%;
  background:var(--ink); border:1.5px dashed rgba(255,255,255,.35);
}
.seal span{
  position:relative; font-family:var(--font-hindi-display); color:#fff;
  font-size:15px; z-index:1; letter-spacing:.5px;
}
.seal.lg{--s:88px;} .seal.lg span{font-size:30px;}
.seal.watermark{opacity:.05; position:absolute;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(239,241,234,.9); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:var(--maxw); margin:0 auto; padding:12px 16px;
  display:flex; align-items:center; gap:10px;
}
@media (min-width:900px){ .topbar-inner{max-width:1180px; padding:14px 32px;} }
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.brand-text{min-width:0;}
.brand-text .name{font-family:var(--font-hindi-display); font-size:17px; font-weight:400; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-text .sub{font-size:10px; color:var(--ink-soft); letter-spacing:.3px;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--paper-raised); display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:.15s;
}
.icon-btn:hover{background:var(--gold-soft); border-color:var(--marigold);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:var(--radius-sm); border:none;
  font-weight:600; font-size:14.5px; transition:.15s; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--maroon); color:#fff; box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--maroon-dark);}
.btn-gold{background:var(--marigold); color:#241300;}
.btn-gold:hover{background:var(--marigold-dark); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
.btn-outline:hover{background:var(--ink); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink); background:var(--paper-raised);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5; pointer-events:none;}
.btn-teal{background:var(--teal); color:#fff;}

/* ---------- Cards ---------- */
.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:18px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
}
.card-hover{transition:.2s;}
.card-hover:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}

/* ---------- Forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field label .req{color:var(--maroon);}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
  background:#fff; font-family:inherit; font-size:14.5px; color:var(--ink); transition:.15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--marigold); box-shadow:0 0 0 3px rgba(226,144,15,.15);}
.field .hint{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.field .err{font-size:12px; color:var(--danger); margin-top:4px; display:none; font-weight:600;}
.field.invalid input, .field.invalid select{border-color:var(--danger);}
.field.invalid .err{display:block;}
.photo-drop{
  border:2px dashed var(--line); border-radius:14px; padding:20px; text-align:center;
  cursor:pointer; background:#fff; transition:.15s;
}
.photo-drop:hover{border-color:var(--marigold); background:var(--gold-soft);}
.photo-drop img{width:88px; height:88px; border-radius:50%; object-fit:cover; margin:0 auto 8px; border:3px solid var(--marigold);}

/* ---------- Badges / tags ---------- */
.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.2px;}
.badge-gold{background:var(--gold-soft); color:var(--marigold-dark);}
.badge-teal{background:var(--teal-soft); color:var(--teal);}
.badge-maroon{background:#F6E4E7; color:var(--maroon);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}
.badge-mono{font-family:var(--font-mono); background:var(--ink); color:#fff;}

/* ---------- Section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin:28px 0 14px;}
.section-head h2{font-size:19px;}
.section-head .see-all{font-size:12.5px; font-weight:700; color:var(--maroon);}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--marigold-dark); margin-bottom:4px;}

/* ---------- Hero ---------- */
.hero{
  border-radius:var(--radius-lg); padding:30px 22px; margin-top:14px; position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--ink) 0%, #22345A 60%, var(--maroon-dark) 130%);
  color:#fff;
}
.hero .seal.watermark{right:-20px; top:-20px; --s:180px;}
.hero .seal.watermark span{font-size:60px;}
.hero-eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--marigold); font-weight:700; margin-bottom:10px;}
.hero h1{font-family:var(--font-hindi-display); font-weight:400; font-size:30px; color:#fff; margin-bottom:8px;}
.hero p{font-size:14px; color:#D9DEEA; max-width:340px; margin-bottom:20px;}
.hero-actions{display:flex; gap:10px; flex-wrap:wrap;}

/* ---------- Stat cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (min-width:700px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
.stat-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow-sm);}
.stat-card .num{font-family:var(--font-display); font-size:26px; font-weight:800; color:var(--ink);}
.stat-card .lbl{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.stat-card .delta{font-size:11px; font-weight:700; margin-top:6px;}
.stat-card .delta.up{color:var(--teal);}

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(248,249,244,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media (min-width:900px){ .bottom-nav{display:none;} }
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 10px; border-radius:10px;
  color:var(--ink-soft); font-size:10px; font-weight:700; flex:1; max-width:76px; transition:.15s;
}
.nav-item.active{color:var(--maroon);}
.nav-item svg{width:21px; height:21px;}

/* ---------- Desktop sidebar ---------- */
.sidebar{display:none;}
@media (min-width:900px){
  .sidebar{display:block; position:sticky; top:78px; align-self:start; padding-top:20px;}
  .sidebar .nav-item{flex-direction:row; max-width:none; justify-content:flex-start; padding:11px 14px; font-size:13.5px; margin-bottom:2px;}
  .sidebar .nav-item.active{background:var(--gold-soft);}
  .sidebar .nav-item svg{width:19px; height:19px;}
}

/* ---------- Toasts ---------- */
#toast-wrap{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:420px;}
.toast{
  background:var(--ink); color:#fff; padding:13px 16px; border-radius:12px; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px;
  animation:toastIn .25s ease;
}
.toast.success{background:var(--teal);}
.toast.error{background:var(--danger);}
.toast.warn{background:var(--marigold-dark);}
@keyframes toastIn{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(20,25,40,.55); z-index:150; display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);}
@media (min-width:640px){ .modal-overlay{align-items:center;} }
.modal{
  background:var(--paper-raised); width:100%; max-width:460px; border-radius:20px 20px 0 0; padding:22px;
  max-height:88vh; overflow-y:auto; animation:modalUp .22s ease;
}
@media (min-width:640px){ .modal{border-radius:20px;} }
@keyframes modalUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}

/* ---------- Skeletons ---------- */
.skel{background:linear-gradient(90deg,#E5E7DC 25%,#F1F2E9 37%,#E5E7DC 63%); background-size:400% 100%; animation:skel 1.4s ease infinite; border-radius:10px;}
@keyframes skel{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}

/* ---------- Empty / error states ---------- */
.state-block{text-align:center; padding:44px 20px; color:var(--ink-soft);}
.state-block .seal{margin:0 auto 14px; opacity:.5;}
.state-block h3{font-size:15px; color:var(--ink); margin-bottom:4px;}
.state-block p{font-size:13px;}

/* ---------- Post / event card ---------- */
.post-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:14px; box-shadow:var(--shadow-sm);}
.post-card img{width:100%; height:150px; object-fit:cover; background:var(--line);}
.post-card .body{padding:14px;}
.post-card h3{font-family:var(--font-hindi-display); font-weight:400; font-size:17px; margin-bottom:6px;}
.post-card p{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
.post-card .meta{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--ink-soft);}

/* ---------- Profile ---------- */
.profile-hero{
  background:linear-gradient(150deg, var(--ink), var(--maroon-dark));
  border-radius:var(--radius-lg); padding:24px 18px; color:#fff; text-align:center; position:relative; overflow:hidden;
}
.profile-hero .avatar{width:92px; height:92px; border-radius:50%; object-fit:cover; border:4px solid var(--marigold); margin:0 auto 10px; background:#fff;}
.profile-hero h2{color:#fff; font-family:var(--font-hindi-display); font-weight:400; font-size:22px;}
.profile-hero .mid{font-family:var(--font-mono); font-size:12px; color:var(--marigold); margin-top:4px; letter-spacing:1px;}
.kv-list{display:grid; gap:0;}
.kv-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; gap:10px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--ink-soft); font-weight:600;}
.kv-row .v{font-weight:600; text-align:right;}

/* ---------- ID Card ---------- */
.id-card-wrap{perspective:1000px;}
.id-card{
  width:100%; max-width:340px; aspect-ratio:85.6/54; margin:0 auto; border-radius:16px; padding:14px;
  background:linear-gradient(135deg, var(--ink) 0%, #223357 60%, var(--maroon-dark) 130%);
  color:#fff; position:relative; overflow:hidden; box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; justify-content:space-between;
}
.id-card .seal.watermark{--s:120px; right:-30px; bottom:-30px;}
.id-card-top{display:flex; align-items:center; gap:8px;}
.id-card-top .name-en{font-family:var(--font-display); font-size:10.5px; font-weight:700; letter-spacing:.4px;}
.id-card-top .name-hi{font-family:var(--font-hindi-display); font-size:8px; color:var(--marigold);}
.id-card-mid{display:flex; gap:10px; align-items:center;}
.id-card-mid img{width:52px; height:52px; border-radius:8px; object-fit:cover; border:2px solid var(--marigold); background:#fff;}
.id-card-mid .info div{font-size:9.5px; line-height:1.5;}
.id-card-mid .info .mname{font-family:var(--font-hindi-display); font-size:13px; margin-bottom:1px;}
.id-card-mid .info .mid{font-family:var(--font-mono); color:var(--marigold); font-size:10px; letter-spacing:.5px;}
.id-card-bottom{font-size:8px; color:#C9CEDD; display:flex; justify-content:space-between;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:#fff;}
table.data{width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px;}
table.data th{background:var(--ink); color:#fff; text-align:left; padding:10px 12px; font-weight:700; position:sticky; top:0;}
table.data td{padding:9px 12px; border-bottom:1px solid var(--line);}
table.data tr:last-child td{border-bottom:none;}
table.data tr:hover td{background:var(--gold-soft);}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px;}
.tab{padding:9px 16px; border-radius:99px; font-size:13px; font-weight:700; white-space:nowrap; background:var(--paper-raised); border:1px solid var(--line); color:var(--ink-soft);}
.tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* ---------- Auth screens ---------- */
.auth-wrap{padding-top:8vh; max-width:420px; margin:0 auto;}
.auth-wrap .seal{margin:0 auto 18px;}
.auth-wrap h1{text-align:center; font-family:var(--font-hindi-display); font-weight:400; font-size:26px;}
.auth-wrap .sub{text-align:center; color:var(--ink-soft); font-size:13px; margin-top:4px; margin-bottom:26px;}
.divider{display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:12px; margin:16px 0;}
.divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:420px){ .grid-3{grid-template-columns:1fr 1fr;} }

/* ---------- Misc ---------- */
.loader{width:22px; height:22px; border:3px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
.loader.ink{border-color:rgba(22,35,61,.2); border-top-color:var(--ink);}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-ring{transform:rotate(-90deg);}
.text-center{text-align:center;} .mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;}
.flex{display:flex;} .items-center{align-items:center;} .gap-8{gap:8px;} .gap-12{gap:12px;} .justify-between{justify-content:space-between;}
.muted{color:var(--ink-soft); font-size:13px;}
.avatar-sm{width:34px; height:34px; border-radius:50%; object-fit:cover; background:var(--line);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.fab{position:fixed; bottom:78px; right:16px; z-index:45; width:54px; height:54px; border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); border:none;}
@media (min-width:900px){ .fab{bottom:32px; right:32px;} }
#recaptcha-container{margin:10px 0;}
.chart-box{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px; margin-bottom:16px; box-shadow:var(--shadow-sm);}
.chart-box h4{font-size:13.5px; margin-bottom:12px; color:var(--ink-soft);}
.footer{margin-top:40px; padding:24px 16px; text-align:center; color:var(--ink-soft); font-size:12px; border-top:1px solid var(--line);}
.print-hide{}
@media print{ .no-print, .bottom-nav, .topbar{display:none !important;} }
</style>
</head>
<body>

<div id="toast-wrap" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="app"></div>

<script>
/* =====================================================================
   1. FIREBASE CONFIGURATION
   Replace the placeholders below with your own Firebase project's
   config (Project settings → General → Your apps → SDK setup).
   Firestore Security Rules & Firebase Auth must enforce authorization —
   this file never stores secret keys, service-account credentials, or
   admin passwords, only the public client config Firebase expects.
===================================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

function toast(msg, type='info', ms=3400){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = {success:'✓', error:'✕', warn:'!', info:'ℹ'}[type] || 'ℹ';
  el.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, ms);
}
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function qs(sel, root=document){ return root.querySelector(sel); }
function qsa(sel, root=document){ return [...root.querySelectorAll(sel)]; }

function calcAge(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr);
  if(isNaN(dob)) return null;
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}
function formatDate(ts){
  let d;
  if(!ts) return '—';
  if(ts.toDate) d = ts.toDate();
  else d = new Date(ts);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function formatDateTime(ts){
  let d = ts && ts.toDate ? ts.toDate() : new Date(ts);
  if(isNaN(d)) return '—';
  return d.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function memberIdFromSeq(seq){ return 'BJS-' + String(seq).padStart(6,'0'); }
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = el(`<div class="modal-overlay"><div class="modal">${html}</div></div>`);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
  return overlay;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmDialog(title, msg, onConfirm, danger=true){

}

async function fileToCompressedDataUrl(file, maxDim=480, quality=.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height*=maxDim/width; width=maxDim; }
        else if(height>maxDim){ width*=maxDim/height; height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function render(){
  const app = document.getElementById('app');
  const bareRoutes = ['login','signup','landing'];
  const isBare = bareRoutes.includes(S.route) || S.role==='guest';

  if(isBare && S.role==='guest'){
    app.innerHTML = renderTopbar(false) + `<div class="shell no-sidebar">${renderRoute()}</div>`;
    afterRender();
    return;
  }

  const navSet = (S.role==='admin'||S.role==='superadmin') ? NAV_ADMIN : NAV_USER;
  app.innerHTML = `
    ${renderTopbar(true)}
    <div class="shell">
      <aside class="sidebar">${renderSidebarNav(navSet)}</aside>
      <main>${renderRoute()}</main>
    </div>
    <nav class="bottom-nav no-print">${renderBottomNav(navSet)}</nav>
  `;
  afterRender();
}

function ensureRecaptcha(){
  if(!fbReady) return null;
  if(!window.recaptchaVerifier){
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size:'invisible' });
  }
  return window.recaptchaVerifier;
}

async function doLogin(){
  const mobile = qs('#login-mobile').value.trim();
  if(!/^[6-9]\d{9}$/.test(mobile)){ toast('Enter a valid 10-digit mobile number','error'); return; }
  const btn = qs('#login-btn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>';
  try{
    if(!fbReady){ toast('Firebase is not configured yet — set firebaseConfig at the top of the file.','warn'); btn.disabled=false; btn.textContent='Login'; return; }
    const snap = await db.collection('users').where('mobile','==',mobile).limit(1).get();
    if(snap.empty){
      toast('User Not Registered','error');
      btn.disabled=false; btn.textContent='Login';
      return;
    }
    const doc = snap.docs[0];
    S.profile = {id:doc.id, ...doc.data()};
    S.role = S.profile.role || 'user';
    S.user = {uid: doc.id, mobile};
    sessionStorage.setItem('bjs_session', JSON.stringify({uid:doc.id, mobile}));
    await db.collection('users').doc(doc.id).update({lastLogin: firebase.firestore.FieldValue.serverTimestamp()});
    toast('Login successful','success');
    navigate('home');
  }catch(e){
    console.error(e); toast('Login failed: '+e.message,'error');
    btn.disabled=false; btn.textContent='Login';
  }
}

}
function validateSignupForm(){
  let ok = true;
  const req = {
    'su-name':'Name required', 'su-mobile':'Mobile required', 'su-dob':'DOB required',
    'su-gender':'Gender required', 'su-jaati':'Jaati required', 'su-job':'Job category required',
    'su-district':'District required', 'su-panchayat':'Panchayat required', 'su-address':'Address required'
  };
  for(const id in req){ if(!qs('#'+id).value){ ok=false; } }
  if(!S.signupPhotoDataUrl){ qs('#err-photo').style.display='block'; ok=false; } else { qs('#err-photo').style.display='none'; }
  const mobile = qs('#su-mobile').value.trim();
  if(!/^[6-9]\d{9}$/.test(mobile)){ qs('#err-mobile').style.display='block'; ok=false; } else { qs('#err-mobile').style.display='none'; }
  if(qs('#su-jaati').value !== 'Bhuihar'){ toast('You must select Bhuihar to sign up','error'); ok=false; }
  return ok;
}
async function sendSignupOtp(){
  if(!validateSignupForm()){ toast('Please complete all required fields','error'); return; }
  if(!fbReady){ toast('Firebase is not configured yet — set firebaseConfig at the top of the file.','warn'); return; }
  const mobile = qs('#su-mobile').value.trim();
  const existing = await db.collection('users').where('mobile','==',mobile).limit(1).get();
  if(!existing.empty){ toast('This mobile number is already registered','error'); return; }
  const btn = qs('#send-otp-btn'); btn.disabled=true; btn.innerHTML='<span class="loader ink"></span>';
  try{
    const verifier = ensureRecaptcha();
    const result = await auth.signInWithPhoneNumber('+91'+mobile, verifier);
    S.confirmationResult = result;
    qs('#otp-block').style.display='block';
    btn.style.display='none';
    toast('OTP sent to your mobile number','success');
  }catch(e){
    console.error(e); toast('Could not send OTP: '+e.message,'error');
    btn.disabled=false; btn.textContent='Send OTP';
  }
}
async function verifyOtpAndCreateAccount(){
  const otp = qs('#su-otp').value.trim();
  if(!otp || otp.length<4){ toast('Enter the OTP you received','error'); return; }
  try{
    const cred = await S.confirmationResult.confirm(otp);
    const uid = cred.user.uid;
    const seqDoc = await db.collection('settings').doc('counters').get();
    const seq = ((seqDoc.exists && seqDoc.data().memberSeq) || 0) + 1;
    await db.collection('settings').doc('counters').set({memberSeq:seq}, {merge:true});
    const memberId = memberIdFromSeq(seq);

    let photoUrl = S.signupPhotoDataUrl;
    if(storage){
      try{
        const ref = storage.ref().child(`profile-photos/${uid}.jpg`);
        await ref.putString(S.signupPhotoDataUrl, 'data_url');
        photoUrl = await ref.getDownloadURL();
      }catch(err){ console.warn('Storage upload failed, keeping inline photo', err); }
    }
    const districtId = qs('#su-district').value;
    const panchayatId = qs('#su-panchayat').value;
    const profile = {
      memberId, name: qs('#su-name').value.trim(),
      fatherName: qs('#su-father').value.trim(), motherName: qs('#su-mother').value.trim(),
      mobile: qs('#su-mobile').value.trim(), dob: qs('#su-dob').value, gender: qs('#su-gender').value,
      photoUrl, jaati:'Bhuihar', jobCategory: qs('#su-job').value,
      districtId, district: (S.districts.find(d=>d.id===districtId)||{}).name || '',
      panchayatId, panchayat: (S.panchayats.find(p=>p.id===panchayatId)||{}).name || '',
      address: qs('#su-address').value.trim(),
      familyMembersCount: Number(qs('#su-famcount').value)||0,
      role:'user', status:'active',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
    };
    await db.collection('users').doc(uid).set(profile);
    S.profile = {id:uid, ...profile}; S.user = {uid}; S.role='user';
    sessionStorage.setItem('bjs_session', JSON.stringify({uid, mobile:profile.mobile}));
    toast('Account created — Welcome!','success');
    navigate('home');
  }catch(e){
    console.error(e); toast('OTP verification failed: '+e.message,'error');
  }
}
async function doLogout(){
  sessionStorage.removeItem('bjs_session');
  S.user=null; S.profile=null; S.role='guest';
  try{ if(fbReady) await auth.signOut(); }catch(e){}
  navigate('home');
}

/* =====================================================================
   11. PDF GENERATION (Profile / Family / District-wise / Alphabetical)
===================================================================== */
function pdfHeader(doc, title){
  doc.setFillColor(22,35,61); doc.rect(0,0,doc.internal.pageSize.getWidth(),26,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text('Bhuihar Jati Samaj', 14, 12);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(title, 14, 19);
  doc.setTextColor(226,144,15); doc.setFontSize(8);
  doc.text('Maharajganj Community Management Portal', doc.internal.pageSize.getWidth()-14, 12, {align:'right'});
  doc.setTextColor(0,0,0);
}
function pdfFooter(doc){
  const pages = doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    const h = doc.internal.pageSize.getHeight(), w = doc.internal.pageSize.getWidth();
    doc.setFontSize(8); doc.setTextColor(120,120,120);
    doc.text(`Generated: ${new Date().toLocaleString('en-IN')}`, 14, h-8);
    doc.text(`Page ${i} of ${pages}`, w-14, h-8, {align:'right'});
  }
}
function generateProfilePdf(){
  if(!window.jspdf){ toast('PDF library still loading, try again shortly','warn'); return; }
  const p = S.profile; if(!p){ toast('Profile not loaded','error'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Member Profile');
  doc.autoTable({
    startY: 34,
    head: [['Field','Detail']],
    body: [

async function loadAdminAnalytics(){
  if(!fbReady){ qs('#admin-stats').innerHTML = emptyState('Firebase not connected','Connect Firestore to see live analytics.'); return; }
  try{
    const usersSnap = await db.collection('users').get();
    const members = usersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    S.members = members;
    const familiesSnap = await db.collection('families').get();
    const eventsSnap = await db.collection('events').get();
    const matriSnap = await db.collection('matrimonial').where('status','==','pending').get();
    const now = new Date(); const thisMonth = members.filter(m=>{
      const c = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
      return c && c.getMonth()===now.getMonth() && c.getFullYear()===now.getFullYear();
    }).length;
    const active = members.filter(m=>m.status==='active').length;
    const districtsSet = new Set(members.map(m=>m.districtId).filter(Boolean));
    const panchayatsSet = new Set(members.map(m=>m.panchayatId).filter(Boolean));

    const stats = [
      ['Total Members', members.length], ['Active Members', active], ['Inactive Members', members.length-active],
      ['Total Families', new Set(familiesSnap.docs.map(d=>d.data().ownerMobile)).size],
      ['Total Districts', S.districts.length], ['Total Panchayats', S.panchayats.length],
      ['New This Month', thisMonth], ['Pending Matrimonial', matriSnap.size],
    ];
    qs('#admin-stats').innerHTML = stats.map(([l,n])=>statCardStatic(l,n)).join('');
    S.events = eventsSnap.docs.map(d=>({id:d.id,...d.data()}));

    renderChart('chart-district','bar', groupCount(members,'district'));
    renderChart('chart-job','doughnut', groupCount(members,'jobCategory'));
    renderChart('chart-signup','line', monthlySignups(members));
    renderChart('chart-blood','doughnut', groupCount(members,'bloodGroup'));
    renderChart('chart-panchayat','bar', groupCount(members,'panchayat'));
  }catch(e){ console.error(e); qs('#admin-stats').innerHTML = errorState(e.message); }
}
function groupCount(list, key){
  const map = {};
  list.forEach(x=>{ const k = x[key]||'Unspecified'; map[k]=(map[k]||0)+1; });
  return {labels:Object.keys(map), data:Object.values(map)};
}
function monthlySignups(members){
  const map = {};
  members.forEach(m=>{
    const d = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : null;
    if(!d) return;
    const key = d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'});
    map[key]=(map[key]||0)+1;
  });
  return {labels:Object.keys(map), data:Object.values(map)};
}
const CHART_PALETTE = ['#7A1E2E','#E2900F','#1F6E5C','#16233D','#B8720A','#3C4A63','#B23A2E','#5E1521'];
function renderChart(canvasId, type, {labels,data}){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(S.charts[canvasId]) S.charts[canvasId].destroy();
  S.charts[canvasId] = new Chart(ctx, {
    type: type==='line'?'line':type,
    data:{ labels, datasets:[{ label:'Members', data, backgroundColor: type==='line' ? 'rgba(122,30,46,.15)' : CHART_PALETTE, borderColor:'#7A1E2E', borderWidth: type==='line'?2:0, tension:.35, fill: type==='line' }]},
    options:{ responsive:true, plugins:{legend:{display:type!=='bar'&&type!=='line'}} }
  });
}

  <div class="section-head" style="margin-top:20px;"><h2>WhatsApp Notifications</h2></div>
  ${!configured ? `<div class="card" style="border-color:var(--marigold);"><strong>Setup required</strong><p class="muted mt-8">WhatsApp Business API is not connected yet. Configure a secure backend endpoint and set WA_ENDPOINT near the top of this file — API tokens must never live in this HTML.</p></div>` : ''}
  <div class="card mt-16">
    <div class="field"><label>Target</label>
      <select id="wa-target"><option>All Members</option><option>By District</option><option>Selected Members</option></select>
    </div>
    <div class="field"><label>Message</label><textarea id="wa-msg" rows="4" placeholder="Type your announcement..."></textarea></div>
    <button class="btn btn-primary btn-block" onclick="sendWhatsApp()">${svgIcon('whatsapp')} Send Notification</button>
  </div>`;
}
async function sendWhatsApp(){
  const msg = qs('#wa-msg').value.trim();
  if(!msg){ toast('Enter a message','error'); return; }
  if(!WA_ENDPOINT){ toast('WhatsApp API is not configured — set WA_ENDPOINT to your secure backend endpoint.','warn'); return; }
  try{
    const res = await fetch(WA_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message:msg, target:qs('#wa-target').value}) });
    if(!res.ok) throw new Error('Backend responded with an error');
    toast('Notification queued for delivery','success');
  }catch(e){ toast('Send failed: '+e.message,'error'); }
}
window.sendWhatsApp=sendWhatsApp;

/* =====================================================================
   23. SUPER ADMIN — ADMIN MANAGEMENT
===================================================================== */
function viewSuperAdmins(){
  if(S.role!=='superadmin') return emptyState('Access restricted','Super Admin only.','🔒');
  setTimeout(loadAdminsList, 0);
  return `
  <div class="section-head" style="margin-top:20px;"><h2>Manage Admins</h2><button class="btn btn-primary btn-sm" onclick="openAdminForm()">+ Create Admin</button></div>
  <div id="admins-list">${skeletonCards(2)}</div>`;
}
async function loadAdminsList(){
  if(!fbReady) return;
  const snap = await db.collection('users').where('role','in',['admin','superadmin']).get();
  const list = snap.docs.map(d=>({id:d.id, ...d.data()}));
  qs('#admins-list').innerHTML = list.length ? list.map(a=>`
    <div class="card flex justify-between items-center" style="margin-bottom:8px;">
      <div><strong>${escapeHtml(a.name)}</strong><div class="muted">${escapeHtml(a.mobile)} · <span class="badge badge-maroon">${a.role}</span> · <span class="badge ${a.status==='active'?'badge-teal':'badge-danger'}">${a.status||'active'}</span></div></div>
      <div class="flex gap-8">
        <button class="btn btn-sm btn-outline" onclick="toggleMemberStatus('${a.id}','${a.status==='active'?'inactive':'active'}')">${a.status==='active'?'Disable':'Enable'}</button>
        <button class="btn btn-sm btn-danger" onclick="removeAdminRole('${a.id}')">Remove Role</button>
      </div>
    </div>`).join('') : emptyState('No admins yet','Promote a registered member to admin.','🛡️');
}
function openAdminForm(){
  openModal(`<div class="modal-head"><h3>Create Admin</h3><button class="icon-btn" onclick="closeModal()">${svgIcon('close')}</button></div>
  <div class="field"><label>Member Mobile Number</label><input id="ad-mobile" maxlength="10" placeholder="Existing registered member's mobile"></div>
  <div class="field"><label>Role</label><select id="ad-role"><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select></div>
  <p class="hint">The member must already have an account. This assigns admin privileges to their existing profile via Firestore role field — enforced by Firestore Security Rules.</p>
  <button class="btn btn-primary btn-block" onclick="promoteToAdmin()">Grant Role</button>`);
}
async function promoteToAdmin(){
  const mobile = qs('#ad-mobile').value.trim(); const role = qs('#ad-role').value;
  try{
    const snap = await db.collection('users').where('mobile','==',mobile).limit(1).get();
    if(snap.empty){ toast('No member found with that mobile number','error'); return; }
    await db.collection('users').doc(snap.docs[0].id).update({role});
    closeModal(); toast('Role granted','success'); loadAdminsList();
  }catch(e){ toast('Failed: '+e.message,'error'); }
}
function removeAdminRole(id){ confirmDialog('Remove admin role?','This member will become a regular user.', async()=>{ await db.collection('users').doc(id).update({role:'user'}); toast('Role removed','success'); loadAdminsList(); }); }
window.openAdminForm=openAdminForm; window.promoteToAdmin=promoteToAdmin; window.removeAdminRole=removeAdminRole;

/* =====================================================================
   24. BOOTSTRAP
===================================================================== */
async function restoreSession(){
  const raw = sessionStorage.getItem('bjs_session');
  if(!raw || !fbReady) return;
  try{
    const {uid} = JSON.parse(raw);
    const doc = await db.collection('users').doc(uid).get();
    if(doc.exists){
      S.profile = {id:doc.id, ...doc.data()};
      S.role = S.profile.role || 'user';
      S.user = {uid};
    }
  }catch(e){ console.warn('Session restore failed', e); }
}

(async function init(){
  render(); // paint instantly with skeleton/landing state
  await loadCoreData();
  await restoreSession();
  render();
  if(S.route==='home') hydrateHomeSections();
})();

/* Re-hydrate home sections whenever we land on 'home' via navigation */
const _origNavigate = navigate;
window.navigate = function(route, params){
  _origNavigate(route, params);
  if(route==='home') setTimeout(hydrateHomeSections, 0);
};
</script>
</body>
</html>
