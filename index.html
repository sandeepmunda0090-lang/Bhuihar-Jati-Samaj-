<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>सदस्य लॉगिन | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#66758a;--line:#e5ebf3;--green:#168c50;--red:#d93025;--shadow:0 10px 28px rgba(20,42,72,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eaf0f7;font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}
#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 50px rgba(0,0,0,0.15);padding-bottom:85px}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}
.header h1{margin:0;font-size:18px;font-weight:800}
.header p{margin:2px 0 0;font-size:11px;opacity:.85}

.container{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}

.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.form-control{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;background:#fafbfc;color:var(--text);outline:none}
.form-control:focus{border-color:var(--p);background:#fff}

.btn{border:0;border-radius:12px;padding:12px 14px;width:100%;font:700 14px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin-top:8px;box-shadow:0 4px 12px rgba(7,87,163,.18);text-align:center}

.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}

#msg{font-size:12px;text-align:center;margin-top:8px;font-weight:700}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>👤 सदस्य लॉगिन</h1>
    <p>अपने मोबाइल नंबर से प्रोफाइल देखें</p>
  </div>

  <div class="container">
    <div class="card" id="loginCard">
      <div class="form-group">
        <label>पंजीकृत मोबाइल नंबर</label>
        <input type="tel" id="loginMobile" class="form-control" placeholder="10 अंक का मोबाइल नंबर" pattern="[0-9]{10}" required>
      </div>
      <button type="button" class="btn" onclick="loginUser()">लॉगिन करें</button>
      <div id="msg"></div>
    </div>

    <!-- प्रोफाइल विवरण बॉक्स (लॉगिन के बाद दिखेगा) -->
    <div class="card" id="profileCard" style="display:none">
      <h3 style="margin:0 0 10px;font-size:16px;color:var(--navy)">नमस्ते, <span id="pName"></span> जी</h3>
      <p style="font-size:12px;margin:4px 0"><b>पिता/पति:</b> <span id="pRelative"></span></p>
      <p style="font-size:12px;margin:4px 0"><b>गाँव:</b> <span id="pVillage"></span></p>
      <p style="font-size:12px;margin:4px 0"><b>गोत्र:</b> <span id="pGotra"></span></p>
      <p style="font-size:12px;margin:4px 0"><b>स्थिति:</b> <span id="pStatus" style="color:var(--green);font-weight:700"></span></p>
      <button type="button" class="btn" style="background:var(--red);margin-top:14px" onclick="logout()">लॉगआउट</button>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html" class="active"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

async function loginUser(){
  let mob=document.getElementById("loginMobile").value.trim();
  let msg=document.getElementById("msg");
  if(mob.length!==10){
    msg.style.color="var(--red)";
    msg.textContent="कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।";
    return;
  }

  msg.style.color="var(--p)";
  msg.textContent="जाँच कर रहे हैं...";

  try{
    let snap=await db.collection("users").where("mobile","==",mob).get();
    if(snap.empty){
      msg.style.color="var(--red)";
      msg.textContent="यह मोबाइल नंबर पंजीकृत नहीं है। कृपया पहले नया पंजीकरण करें।";
    }else{
      let d=snap.docs[0].data();
      document.getElementById("pName").textContent=d.fullName;
      document.getElementById("pRelative").textContent=d.relativeName||'-';
      document.getElementById("pVillage").textContent=d.village||'महाराजगंज';
      document.getElementById("pGotra").textContent=d.gotra||'-';
      document.getElementById("pStatus").textContent=d.status==='approved'?'स्वीकृत (Active)':'सत्यापन लंबित (Pending)';
      
      document.getElementById("loginCard").style.display="none";
      document.getElementById("profileCard").style.display="block";
    }
  }catch(e){
    msg.style.color="var(--red)";
    msg.textContent="त्रुटि हुई। पुनः प्रयास करें।";
  }
}

function logout(){
  document.getElementById("loginCard").style.display="block";
  document.getElementById("profileCard").style.display="none";
  document.getElementById("loginMobile").value="";
  document.getElementById("msg").textContent="";
}
</script>
</body>
</html>
