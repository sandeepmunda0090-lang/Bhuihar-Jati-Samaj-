<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भुईहर जाति समाज</title>
    <style>
        :root { --primary: #8B0000; --accent: #d4af37; --bg: #fdfbf7; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; min-height: 100vh; padding-bottom: 80px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        header { text-align: center; padding: 20px; border-bottom: 2px solid var(--primary); }
        .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .slider { width: 100%; height: 200px; overflow: hidden; }
        .slider img { width: 100%; height: 100%; object-fit: cover; }
        .stats { display: flex; justify-content: space-around; padding: 20px; background: var(--primary); color: white; }
        .card { padding: 15px; margin: 10px; border: 1px solid #ddd; border-radius: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; max-width: 600px; background: white; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: var(--primary); color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img id="logo" src="https://via.placeholder.com/150" class="logo">
        <h2>भुईहर जाति समाज</h2>
    </header>

    <div class="slider">
        <img id="banner" src="https://via.placeholder.com/600x200" alt="Banner">
    </div>

    <div class="stats">
        <div>परिवार: <span id="fam">0</span></div>
        <div>सदस्य: <span id="mem">0</span></div>
    </div>

    <div id="content" class="card">
        <h3>सूचना</h3>
        <p id="msg">समाज के डिजिटल मंच पर स्वागत है।</p>
    </div>

    <div class="nav">
        <button onclick="location.reload()">Home</button>
        <button onclick="admin()">Admin</button>
    </div>
</div>

<script>
    // Initial Load
    document.getElementById('logo').src = localStorage.getItem('logo') || 'https://via.placeholder.com/150';
    document.getElementById('banner').src = localStorage.getItem('banner') || 'https://via.placeholder.com/600x200';
    document.getElementById('msg').innerText = localStorage.getItem('msg') || "Welcome!";

    function admin() {
        let p = prompt("Password (1234):");
        if(p == "1234") {
            let l = prompt("Logo URL:", localStorage.getItem('logo'));
            let b = prompt("Banner URL:", localStorage.getItem('banner'));
            let m = prompt("Message:", localStorage.getItem('msg'));
            localStorage.setItem('logo', l); localStorage.setItem('banner', b); localStorage.setItem('msg', m);
            location.reload();
        }
    }
</script>
</body>
</html>
