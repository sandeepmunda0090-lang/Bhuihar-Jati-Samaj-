<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भुईहर जाति समाज</title>
    <style>
        :root {
            --primary: #8B0000; --accent: #D4AF37; --bg: #F4F7F6;
            --white: #FFFFFF; --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body { background: var(--bg); margin: 0; font-family: 'Segoe UI', sans-serif; color: #333; }
        
        /* Glassmorphism Header */
        header { 
            background: var(--white); padding: 20px; text-align: center;
            box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100;
        }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; }
        h1 { font-size: 22px; color: var(--primary); margin-top: 10px; }

        /* Banner Slider */
        .banner { width: 92%; height: 180px; margin: 20px auto; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
        .banner img { width: 100%; height: 100%; object-fit: cover; }

        /* Modern Dashboard Cards */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
        .card { background: var(--white); padding: 15px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); border-bottom: 4px solid var(--primary); }
        .card h3 { font-size: 14px; color: #666; margin: 0; }
        .card p { font-size: 20px; font-weight: bold; color: var(--primary); margin: 5px 0 0; }

        /* Professional Admin Panel */
        .admin-box { background: #fff; padding: 20px; border-radius: 15px; margin: 15px; box-shadow: var(--shadow); display: none; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Floating Nav */
        .nav { position: fixed; bottom: 20px; left: 5%; width: 90%; background: var(--primary); padding: 10px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .nav button { background: none; border: none; color: white; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <img id="logoImg" src="https://via.placeholder.com/150" class="logo" alt="Logo">
    <h1>भुईहर जाति समाज</h1>
</header>

<div class="banner">
    <img id="bannerImg" src="https://via.placeholder.com/600x300" alt="Banner">
</div>

<div class="stats-grid">
    <div class="card"><h3>कुल परिवार</h3><p id="famCount">0</p></div>
    <div class="card"><h3>कुल सदस्य</h3><p id="memCount">0</p></div>
</div>

<div id="adminPanel" class="admin-box">
    <h3>🛠️ एडमिन सेटिंग</h3>
    <input type="text" id="logoIn" placeholder="Logo URL">
    <input type="text" id="bannerIn" placeholder="Banner URL">
    <button class="btn" onclick="saveData()">Update Changes</button>
</div>

<div class="nav">
    <button onclick="location.reload()">🏠 Home</button>
    <button onclick="toggleAdmin()">⚙️ Admin</button>
</div>

<script>
    // Pull to Refresh
    let sy = 0;
    window.addEventListener('touchstart', e => sy = e.touches[0].clientY);
    window.addEventListener('touchend', e => { if (window.scrollY === 0 && e.changedTouches[0].clientY - sy > 100) location.reload(); });

    // Load Data
    document.getElementById('logoImg').src = localStorage.getItem('logo') || 'https://via.placeholder.com/150';
    document.getElementById('bannerImg').src = localStorage.getItem('banner') || 'https://via.placeholder.com/600x300';

    function toggleAdmin() {
        let p = prompt("पासवर्ड डालें (1234):");
        if(p === "1234") document.getElementById('adminPanel').style.display = 'block';
    }

    function saveData() {
        localStorage.setItem('logo', document.getElementById('logoIn').value);
        localStorage.setItem('banner', document.getElementById('bannerIn').value);
        location.reload();
    }
</script>
</body>
</html>
