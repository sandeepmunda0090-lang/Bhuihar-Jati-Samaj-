<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भुईहर जाति समाज</title>
    <style>
        :root { 
            --primary-color: #8B0000; 
            --secondary-color: #fdfbf7; 
            --accent-color: #d4af37;
            --text-color: #333; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.3s ease; }
        body { background-color: var(--secondary-color); color: var(--text-color); padding: 10px; padding-bottom: 70px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid var(--accent-color); }
        
        /* Top Center Logo Header */
        header { 
            text-align: center; 
            padding: 15px 0; 
            border-bottom: 2px dashed #e0d0c0;
            margin-bottom: 15px; 
        }
        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 10px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.2);
            animation: pulseLogo 3s infinite alternate;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes pulseLogo {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        header h1 { font-size: 20px; color: var(--primary-color); font-weight: bold; }

        /* Stats Cards */
        .stats-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-card { flex: 1; background: linear-gradient(135deg, #8B0000, #a93226); color: white; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-card span { display: block; font-size: 18px; font-weight: bold; margin-top: 4px; color: #f1c40f; }

        .section-title { font-size: 16px; font-weight: bold; margin: 15px 0 10px 0; border-left: 4px solid var(--primary-color); padding-left: 6px; color: var(--primary-color); }
        
        /* Padadhikari Grid with Hover Motion */
        .grid-6 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: #fff; border: 1px solid #e0d0c0; padding: 12px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(139,0,0,0.15); border-color: var(--accent-color); }
        .card h4 { font-size: 14px; margin-bottom: 3px; color: #222; }
        .card p { font-size: 12px; color: #666; margin-bottom: 8px; }
        
        .card-btns a { text-decoration: none; padding: 5px 10px; font-size: 11px; color: white; border-radius: 4px; display: inline-block; margin: 2px; font-weight: bold; }
        .btn-call { background: #007bff; }
        .btn-call:hover { background: #0056b3; transform: scale(1.05); }
        .btn-wa { background: #25d366; }
        .btn-wa:hover { background: #1ebe57; transform: scale(1.05); }

        .box { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 15px; }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus, select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 5px rgba(139,0,0,0.2); }
        
        .btn-submit { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #219653; }
        .btn-login { background-color: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-login:hover { background-color: #1f618d; }
        .btn-reject { background-color: #c0392b; color: white; border: none; font-weight: bold; cursor: pointer; }
        
        .family-item { background: #fdfbf7; border: 1px solid #e0d0c0; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }

        /* Bottom Fixed Navigation Bar (Left to Right) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 2px solid var(--accent-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .nav-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .nav-btn:hover {
            background: #a93226;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(139,0,0,0.3);
        }

        /* Print Settings */
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 20px; }
            .no-print { display: none !important; }
            .print-footer { display: block !important; margin-top: 60px; text-align: right; font-weight: bold; }
        }
        .print-footer { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Center Logo & Header -->
    <header>
        <div class="logo-container">
            <!-- Yahan aapke diye gaye logo ki image link set ki gayi hai -->
            <img src="1000337852.png" alt="Bhujar Samaj Logo">
        </div>
        <h1>भुईहर जाति समाज</h1>
        <p style="font-size: 12px; color: #666; margin-top: 3px;">एकता • सेवा • सम्मान</p>
    </header>

    <div class="no-print">
        <div class="stats-box">
            <div class="stat-card">कुल परिवार (Families)<span id="familyCount">0</span></div>
            <div class="stat-card">कुल सदस्य (Members)<span id="memberCount">0</span></div>
        </div>

        <div class="section-title">कार्यकारिणी समिति (Padadhikari)</div>
        <div class="grid-6" id="padadhikariGrid"></div>
    </div>

    <!-- Dynamic Container for Views -->
    <div id="dynamicView"></div>
</div>

<!-- Bottom Left to Right Navigation Bar -->
<div class="bottom-nav no-print">
    <button class="nav-btn" onclick="showView('home')">🏠 Home</button>
    <button class="nav-btn" onclick="showView('signup')">📝 Signup</button>
    <button class="nav-btn" onclick="showView('login')">🔑 Login</button>
</div>

<script>
    const ADMIN_MOBILE = "6266240812";

    let users = JSON.parse(localStorage.getItem('bhuihar_users')) || [];
    let families = JSON.parse(localStorage.getItem('bhuihar_families')) || [];
    let pending = JSON.parse(localStorage.getItem('bhuihar_pending')) || [];
    let currentUser = JSON.parse(localStorage.getItem('bhuihar_current_user')) || null;

    let defaultPadadhikari = [
        {name: "श्री महतो जी", post: "अध्यक्ष", phone: "9800000000"},
        {name: "श्री सचिव जी", post: "सचिव", phone: "9800000001"},
        {name: "श्री कोषाध्यक्ष जी", post: "कोषाध्यक्ष", phone: "9800000002"},
        {name: "श्री संरक्षक जी", post: "संरक्षक", phone: "9800000003"},
        {name: "श्री सह-सचिव जी", post: "सह-सचिव", phone: "9800000004"},
        {name: "श्री मीडिया प्रभारी", post: "प्रभारी", phone: "9800000005"}
    ];
    let padadhikariList = JSON.parse(localStorage.getItem('bhuihar_padadhikari')) || defaultPadadhikari;

    function updateCounts() {
        document.getElementById('familyCount').innerText = families.length;
        let totalMems = families.reduce((acc, f) => acc + 1 + (f.members ? f.members.length : 0), 0);
        document.getElementById('memberCount').innerText = totalMems;
    }
    updateCounts();

    function renderPadadhikari() {
        const grid = document.getElementById('padadhikariGrid');
        grid.innerHTML = "";
        padadhikariList.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <h4>${p.name}</h4>
                    <p>${p.post}</p>
                    <div class="card-btns">
                        <a href="tel:+91${p.phone}" class="btn-call">📞 Call</a>
                        <a href="https://wa.me/91${p.phone}" class="btn-wa">💬 WhatsApp</a>
                    </div>
                </div>`;
        });
    }
    renderPadadhikari();

    function showView(viewName) {
        let box = document.getElementById('dynamicView');
        
        if(currentUser) {
            if(currentUser.isAdmin) {
                renderAdminPanel();
                return;
            } else {
                renderUserDashboard();
                return;
            }
        }

        if(viewName === 'home') {
            box.innerHTML = `
                <div class="box" style="background: #fff8e1; border-color: #ffe082; text-align: center;">
                    <h3 style="color: #8B0000; margin-bottom: 8px;">🤝 आइए, हम सब मिलकर समाज को जोड़ें!</h3>
                    <p style="font-size: 13px; color: #444; line-height: 1.5;">भुईहर जाति समाज के इस डिजिटल मंच पर आपका स्वागत है। परिवार जोड़ने के लिए नीचे दिए गए <b>Signup</b> या <b>Login</b> बटन का उपयोग करें।</p>
                </div>`;
        } else if(viewName === 'signup') {
            box.innerHTML = `
                <div class="box">
                    <h3>सद्‌स्य पंजीकरण (Signup)</h3>
                    <input type="text" id="firstName" placeholder="First Name (पहला नाम)">
                    <input type="text" id="lastName" placeholder="Last Name (उपनाम / गोत्र)">
                    <input type="email" id="email" placeholder="Email Address">
                    <input type="tel" id="mobile" placeholder="Mobile Number (लॉगिन आईडी)">
                    <label style="font-size: 12px; color: #666;">जन्म तिथि (DOB):</label>
                    <input type="date" id="dob" onchange="calcAge()">
                    <input type="text" id="age" placeholder="Age (आयु - ऑटो कैलकुलेट)" readonly style="background:#eee;">
                    <select id="gender"><option value="">Gender चुनें</option><option value="Male">Male</option><option value="Female">Female</option></select>
                    <button class="btn-submit" onclick="submitSignup()">पंजीकरण अनुरोध भेजें</button>
                </div>`;
        } else if(viewName === 'login') {
            box.innerHTML = `
                <div class="box">
                    <h3>सद्‌स्य लॉगिन (Login)</h3>
                    <input type="tel" id="loginMobile" placeholder="रजिस्टर्ड मोबाइल नंबर दर्ज करें">
                    <button class="btn-login" onclick="submitLogin()">लॉगिन करें</button>
                </div>`;
        }
    }

    function calcAge() {
        let dob = document.getElementById('dob').value;
        if(!dob) return;
        let diff = Date.now() - new Date(dob).getTime();
        document.getElementById('age').value = Math.abs(new Date(diff).getUTCFullYear() - 1970) + " वर्ष";
    }

    function submitSignup() {
        let fName = document.getElementById('firstName').value.trim();
        let lName = document.getElementById('lastName').value.trim();
        let email = document.getElementById('email').value.trim();
        let mobile = document.getElementById('mobile').value.trim();
        let dob = document.getElementById('dob').value;
        let age = document.getElementById('age').value;
        let gender = document.getElementById('gender').value;

        if(!fName || !mobile || !dob) { alert("कृपया सभी जरूरी विवरण भरें!"); return; }
        if(pending.some(r => r.mobile === mobile) || users.some(u => u.mobile === mobile)) {
            alert("यह मोबाइल नंबर पहले से रजिस्टर्ड या लंबित है!"); return;
        }

        pending.push({ fName, lName, email, mobile, dob, age, gender });
        localStorage.setItem('bhuihar_pending', JSON.stringify(pending));
        alert("पंजीकरण अनुरोध एडमिन के पास भेज दिया गया है!");
        showView('home');
    }

    function submitLogin() {
        let mob = document.getElementById('loginMobile').value.trim();
        if(!mob) { alert("मोबाइल नंबर दर्ज करें!"); return; }

        if(mob === ADMIN_MOBILE) {
            currentUser = { mobile: mob, isAdmin: true };
            localStorage.setItem('bhuihar_current_user', JSON.stringify(currentUser));
            showView('admin');
            return;
        }

        let found = users.find(u => u.mobile === mob);
        if(found) {
            currentUser = found;
            localStorage.setItem('bhuihar_current_user', JSON.stringify(currentUser));
            showView('dashboard');
        } else {
            alert("यह नंबर रजिस्टर्ड नहीं है या एडमिन द्वारा अभी स्वीकृत नहीं किया गया है!");
        }
    }

    function renderUserDashboard() {
        let famObj = families.find(f => f.mobile === currentUser.mobile) || { members: [] };
        let famHtml = "";
        famObj.members.forEach((m, i) => {
            famHtml += `<div class="family-item"><b>${i+1}. ${m.name}</b> (${m.relation}) - उम्र: ${m.age} वर्ष</div>`;
        });

        document.getElementById('dynamicView').innerHTML = `
            <div class="box" style="background: #eaf2f8;">
                <h3>👋 स्वागत है, ${currentUser.fName} ${currentUser.lName}</h3>
                <p style="font-size:13px; color:#555; margin:5px 0;">मोबाइल: ${currentUser.mobile}</p>
                <button onclick="logout()" style="background:#c0392b; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px; cursor:pointer;">लॉग आउट</button>
            </div>
            <div class="box">
                <h3>परिवार के सदस्य जोड़ें (Family Details)</h3>
                <input type="text" id="famName" placeholder="सदस्य का नाम">
                <input type="text" id="famRelation" placeholder="रिश्ता (जैसे: पत्नी, पुत्र)">
                <input type="number" id="famAge" placeholder="आयु">
                <button class="btn-submit" onclick="addFamilyMember()">+ सदस्य जोड़ें</button>
                <h4 style="margin-top:15px; font-size:14px; border-bottom:1px solid #ddd; padding-bottom:5px;">आपके परिवार के सदस्य:</h4>
                <div style="margin-top:10px;">${famHtml || '<p style="font-size:13px; color:#777;">कोई सदस्य नहीं जुड़ा।</p>'}</div>
            </div>`;
    }

    function addFamilyMember() {
        let name = document.getElementById('famName').value.trim();
        let relation = document.getElementById('famRelation').value.trim();
        let age = document.getElementById('famAge').value.trim();

        if(!name || !relation) { alert("नाम और रिश्ता भरें!"); return; }

        let famObj = families.find(f => f.mobile === currentUser.mobile);
        if(famObj) {
            if(!famObj.members) famObj.members = [];
            famObj.members.push({ name, relation, age });
            localStorage.setItem('bhuihar_families', JSON.stringify(families));
            updateCounts();
            renderUserDashboard();
            alert("सदस्य जोड़ दिया गया है!");
        }
    }

    function renderAdminPanel() {
        let pendingHtml = "";
        if(pending.length === 0) {
            pendingHtml = `<p style="font-size:13px; color:#666;">कोई लंबित अनुरोध नहीं है।</p>`;
        } else {
            pending.forEach((req, idx) => {
                pendingHtml += `
                    <div class="family-item">
                        <b>${req.fName} ${req.lName}</b> (${req.mobile}) - ${req.age}<br>
                        <button class="btn-submit" style="padding:4px 8px; margin-top:5px; width:auto;" onclick="approveReq(${idx})">✓ स्वीकृत करें</button>
                        <button class="btn-reject" style="padding:4px 8px; margin-top:5px; width:auto;" onclick="rejectReq(${idx})">✕ हटाएं</button>
                    </div>`;
            });
        }

        let padEditHtml = "";
        padadhikariList.forEach((p, idx) => {
            padEditHtml += `
                <div style="margin-bottom:8px;">
                    <b>पद ${idx+1}:</b>
                    <input type="text" id="p_name_${idx}" value="${p.name}">
                    <input type="text" id="p_post_${idx}" value="${p.post}">
                    <input type="text" id="p_phone_${idx}" value="${p.phone}">
                </div>`;
        });

        document.getElementById('dynamicView').innerHTML = `
            <div id="printableArea">
                <div class="box" style="background: #fadbd8;">
                    <h3>🛡️ एडमिन नियंत्रण कक्ष (Admin Panel)</h3>
                    <button class="no-print" onclick="logout()" style="background:#c0392b; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px; margin-top:8px; cursor:pointer;">लॉग आउट</button>
                </div>

                <div class="box no-print">
                    <h3>कार्यकारिणी समिति (6 Padadhikari Edit करें)</h3>
                    ${padEditHtml}
                    <button class="btn-submit" onclick="savePadadhikari()">💾 पदाधिकारी सेव करें</button>
                </div>

                <div class="box no-print">
                    <h3>लंबित पंजीकरण अनुरोध (Pending Approvals)</h3>
                    ${pendingHtml}
                </div>

                <div class="box">
                    <h3>समाज के सभी सत्यापित परिवार</h3>
                    <div style="margin-top:10px;">
                        ${families.map((f, i) => `<b>${i+1}. मुखिया: ${f.fName} ${f.lName}</b> (${f.mobile}) - सदस्य: ${f.members ? f.members.length : 0}<br>`).join('') || 'कोई परिवार नहीं।'}
                    </div>
                </div>

                <div class="print-footer">
                    मुखिया के हस्ताक्षर
                </div>
            </div>
            <button class="no-print btn-submit" style="margin-top:15px; background:#333;" onclick="window.print()">🖨️ सूची प्रिंट करें</button>`;
    }

    function savePadadhikari() {
        for(let i=0; i<6; i++) {
            padadhikariList[i].name = document.getElementById(`p_name_${i}`).value;
            padadhikariList[i].post = document.getElementById(`p_post_${i}`).value;
            padadhikariList[i].phone = document.getElementById(`p_phone_${i}`).value;
        }
        localStorage.setItem('bhuihar_padadhikari', JSON.stringify(padadhikariList));
        alert("पदाधिकारी अपडेट हो गए!");
        location.reload();
    }

    function approveReq(idx) {
        let approved = pending.splice(idx, 1)[0];
        approved.members = [];
        users.push(approved);
        families.push(approved);
        localStorage.setItem('bhuihar_pending', JSON.stringify(pending));
        localStorage.setItem('bhuihar_users', JSON.stringify(users));
        localStorage.setItem('bhuihar_families', JSON.stringify(families));
        updateCounts();
        renderAdminPanel();
        alert("सदस्य स्वीकृत कर लिया गया!");
    }

    function rejectReq(idx) {
        pending.splice(idx, 1);
        localStorage.setItem('bhuihar_pending', JSON.stringify(pending));
        renderAdminPanel();
    }

    function logout() {
        localStorage.removeItem('bhuihar_current_user');
        currentUser = null;
        window.location.href = "index.html";
    }

    if(currentUser) {
        showView(currentUser.isAdmin ? 'admin' : 'dashboard');
    } else {
        showView('home');
    }
</script>
</body>
</html>
