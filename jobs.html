<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>रोज़गार व नौकरी | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#66758a;--line:#e5ebf3;--green:#168c50;--red:#d93025;--shadow:0 10px 28px rgba(20,42,72,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eaf0f7;font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}
#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 50px rgba(0,0,0,0.15);padding-bottom:85px}

@keyframes borderRotate {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:18px 16px;border-radius:0 0 22px 22px}
.header h1{margin:0;font-size:18px;font-weight:800}
.header p{margin:2px 0 0;font-size:11px;opacity:.85}

.container{padding:12px}

/* एकदम पतला और खूबसूरत रनिंग बॉर्डर कार्ड */
.job-card {
  position: relative;
  border-radius: 16px;
  background: var(--card);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  z-index: 1;
  overflow: hidden;
}
.job-card::before {
  content: '';
  position: absolute;
  top: -1.5px; left: -1.5px; right: -1.5px; bottom: -1.5px;
  background: linear-gradient(45deg, #0757a3, #f4b63f, #168c50, #0d7bd3, #0757a3);
  background-size: 400%;
  border-radius: 17px;
  z-index: -1;
  animation: borderRotate 5s linear infinite;
}

.job-inner {
  background: #fff;
  border-radius: 15px;
  padding: 14px;
}

.job-info h3{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--navy)}
.job-info p{margin:2px 0;font-size:11.5px;color:var(--muted)}
.call-btn{background:linear-gradient(135deg,#168c50,#1fac63);color:#fff;border:0;padding:8px 12px;border-radius:10px;font:700 12px inherit;cursor:pointer;text-decoration:none;display:inline-block;margin-top:8px}

.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>💼 रोज़गार व नौकरी सहायता</h1>
    <p>समाज के युवाओं हेतु कार्य व अवसर</p>
  </div>

  <div class="container" id="jobContainer">
    <div class="job-card">
      <div class="job-inner">
        <div class="job-info">
          <h3>दुकान सहायक / ऑपरेटर आवश्यकता</h3>
          <p><b>कार्यक्षेत्र:</b> महाराजगंज • <b>वेतन:</b> योग्यतानुसार</p>
          <p>📍 संपर्क करें और काम की जानकारी प्राप्त करें</p>
          <a href="tel:9111111111" class="call-btn">📞 संपर्क करें</a>
        </div>
      </div>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

async function loadJobs(){
  try{
    let snap=await db.collection("jobs").get();
    let container=document.getElementById("jobContainer");
    if(!snap.empty){
      let html="";
      snap.forEach(doc=>{
        let d=doc.data();
        html+=`<div class="job-card"><div class="job-inner"><div class="job-info">
          <h3>${d.jobTitle}</h3>
          <p><b>कार्यक्षेत्र:</b> ${d.location||'महाराजगंज'} • <b>वेतन:</b> ${d.salary||'-'}</p>
          <p>📍 ${d.description||''}</p>
          <a href="tel:${d.mobile}" class="call-btn">📞 संपर्क करें</a>
        </div></div></div>`;
      });
      container.innerHTML=html;
    }
  }catch(e){}
}
loadJobs();
</script>
</body>
</html>
