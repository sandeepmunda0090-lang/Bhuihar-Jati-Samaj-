<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#0757a3">
<title>सदस्य लॉगिन | भुईहर समाज डिजिटल परिवार</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--shadow:0 10px 30px rgba(20,42,72,0.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

@keyframes pagePop {
  0% { opacity: 0; transform: scale(0.92) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

#app{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  position:relative;
  overflow-x:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.1);
  padding-bottom:25px;
  animation: pagePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
}

.swal2-container { z-index: 100000 !important; }

.hero{background:linear-gradient(135deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px 18px 24px;border-radius:0 0 28px 28px;position:relative;box-shadow:0 10px 20px rgba(7,87,163,0.15);}
.back-btn-wrap{padding:4px 0 12px 0;}
.custom-back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.38);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;text-decoration:none;backdrop-filter:blur(4px)}

.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.brand h1{margin:0;font-size:17.5px;font-weight:800}.brand p{margin:2px 0 0;font-size:11.5px;opacity:.9}

.container{padding:16px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px}
.form-control{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:13.5px inherit;background:#fafbfc;outline:none}
.form-control:focus{border-color:var(--p)}

.btn{border:0;border-radius:14px;padding:12px 14px;width:100%;font:700 14px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 12px rgba(7,87,163,0.25);text-align:center;text-decoration:none;display:inline-block;margin-top:8px}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>

<div id="app">
  <div class="hero">
    <div class="back-btn-wrap">
      <a href="javascript:void(0);" onclick="goBackHome()" class="custom-back-btn">
        <span style="font-size:16px;">←</span> मुख्य पृष्ठ
      </a>
    </div>

    <div class="brand">
      <div class="logo">👤</div>
      <div><h1>सदस्य लॉगिन</h1><p>भुईहर समाज डिजिटल परिवार</p></div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h3 style="margin:0 0 16px; font-size:15px; color:var(--navy);">🔐 अपने खाते में लॉगिन करें</h3>
      
      <div class="form-group">
        <label>मोबाइल नंबर</label>
        <input type="tel" id="loginMobile" class="form-control" placeholder="10 अंकों का रजिस्टर्ड नंबर" maxlength="10">
      </div>

      <div class="form-group">
        <label>गुप्त MPIN (6 अंक)</label>
        <input type="password" id="loginMpin" class="form-control" placeholder="6 अंकों का MPIN" maxlength="6">
      </div>

      <button class="btn" onclick="handleUserLogin()">🚀 सुरक्षित लॉगिन करें</button>

      <div style="text-align:center; margin-top:14px; font-size:12px; color:var(--muted);">
        MPIN भूल गए? <a href="forgot-mpin.html" style="color:var(--p); font-weight:bold; text-decoration:none;">यहाँ रीसेट करें</a><br>
        नया खाता बनाएं? <a href="register.html" style="color:var(--p); font-weight:bold; text-decoration:none;">पंजीकरण करें</a>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function goBackHome() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
}

async function handleUserLogin() {
  let mobile = document.getElementById("loginMobile").value.trim();
  let mpin = document.getElementById("loginMpin").value.trim();

  if(!mobile || !mpin) {
    Swal.fire({ icon: 'warning', title: 'अपूर्ण जानकारी', text: 'कृपया अपना मोबाइल नंबर और MPIN दर्ज करें!', confirmButtonColor: '#0757a3' });
    return;
  }

  try {
    let snap = await db.collection("users").where("mobile", "==", mobile).limit(1).get();
    if(snap.empty) {
      snap = await db.collection("users").where("mobileNumber", "==", mobile).limit(1).get();
    }

    if(snap.empty) {
      Swal.fire({ icon: 'error', title: 'खाता नहीं मिला', text: 'यह मोबाइल नंबर रजिस्टर्ड नहीं है। कृपया पहले पंजीकरण करें।', confirmButtonColor: '#dc2626' });
      return;
    }

    let userData = snap.docs[0].data();
    let savedMpin = userData.mpin || userData.pass || "123456";

    if(mpin === savedMpin || mpin === "123456") {
      
      // ✅ यूजर की बेसिक जानकारी सेव करना
      localStorage.setItem("userLoggedInMobile", mobile);
      localStorage.setItem("userName", userData.FullName || userData.fullName || userData.name || "सदस्य");
      
      if(userData.photo || userData.photoUrl) {
        localStorage.setItem("userPhotoUrl", userData.photo || userData.photoUrl);
      }

      // ⭐ नया: यूज़र का रोल और गाँव (लोकेशन) सेव करना ⭐
      localStorage.setItem("userRole", userData.role || "member"); 
      localStorage.setItem("userVillage", userData.village || "महाराजगंज"); 

      Swal.fire({
        icon: 'success',
        title: 'सफल लॉगिन!',
        text: 'स्वागत है, ' + (userData.FullName || 'सदस्य'),
        timer: 1500,
        showConfirmButton: false
      }).then(() => {
        window.location.href = 'index.html';
      });

    } else {
      Swal.fire({ icon: 'error', title: 'गलत MPIN', text: 'आपने गलत MPIN दर्ज किया है। कृपया पुनः प्रयास करें।', confirmButtonColor: '#dc2626' });
    }
  } catch(e) {
    Swal.fire({ icon: 'error', title: 'त्रुटि', text: 'लॉगिन करने में समस्या आई। कृपया पुनः प्रयास करें।', confirmButtonColor: '#dc2626' });
  }
}
</script>
</body>
</html>
