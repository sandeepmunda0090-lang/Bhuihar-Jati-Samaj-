<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>नया सदस्य पंजीकरण | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--green:#168c50;--red:#d93025;--shadow:0 4px 16px rgba(20,42,72,0.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}

#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,0.1);padding-bottom:80px;}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px;border-radius:0 0 20px 20px;text-align:center;}
.header h1{margin:0;font-size:18px;font-weight:800}
.header p{margin:3px 0 0;font-size:11.5px;opacity:.85}

.container{padding:14px}

.form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:11.5px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.form-group input, .form-group select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:13px inherit;background:#f9fafb;color:var(--text)}

.row-group{display:flex;gap:8px;}
.row-group select{flex:1;}
.row-group input{flex:2;}

.btn{border:0;border-radius:12px;padding:12px;width:100%;font:700 13.5px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 12px rgba(7,87,163,.18);margin-top:8px;}

/* बॉटम नेविगेशन */
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>📝 नया सदस्य पंजीकरण</h1>
    <p>भुईहर जाति समाज • डिजिटल पोर्टल</p>
  </div>

  <div class="container">
    <div class="form-card">
      <div class="form-group">
        <label>पूरा नाम (Full Name) *</label>
        <input type="text" id="regName" placeholder="अपना पूरा नाम दर्ज करें">
      </div>

      <div class="form-group">
        <label>मोबाइल नंबर (Login ID) *</label>
        <input type="tel" id="regMobile" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर">
      </div>

      <!-- पिता या पति का चयन और नाम -->
      <div class="form-group">
        <label>पिता / पति का नाम *</label>
        <div class="row-group">
          <select id="relationType">
            <option value="पिता का नाम">पिता का नाम</option>
            <option value="पति का नाम">पति का नाम</option>
          </select>
          <input type="text" id="regRelationName" placeholder="नाम दर्ज करें">
        </div>
      </div>

      <div class="form-group">
        <label>गोत्र (Gotra) *</label>
        <input type="text" id="regGotra" placeholder="जैसे: कश्यप, वत्स आदि">
      </div>

      <div class="form-group">
        <label>जिला (District) *</label>
        <select id="regDistrict">
          <option value="">-- जिला चुनें --</option>
        </select>
      </div>

      <div class="form-group">
        <label>ग्राम पंचायत (Panchayat) *</label>
        <select id="regPanchayat">
          <option value="">-- ग्राम पंचायत चुनें --</option>
        </select>
      </div>

      <div class="form-group">
        <label>गाँव / वार्ड का नाम *</label>
        <input type="text" id="regVillage" placeholder="गाँव या मोहल्ले का नाम">
      </div>

      <div class="form-group">
        <label>रक्त समूह (Blood Group)</label>
        <select id="regBlood">
          <option value="">-- चुनें --</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>

      <div class="form-group">
        <label>6 अंकों का गुप्त पिन (MPIN) बनाएँ *</label>
        <input type="password" id="regMpin" maxlength="6" placeholder="लॉगिन के लिए 6 अंकों का पिन">
      </div>

      <button class="btn" onclick="submitRegistration()">पंजीकरण सुरक्षित करें</button>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

window.onload = function(){
  loadDropdowns();
}

async function loadDropdowns(){
  try {
    let distSnap = await db.collection("districts").get();
    let distSelect = document.getElementById("regDistrict");
    distSnap.forEach(doc => {
      let data = doc.data();
      let opt = document.createElement("option");
      opt.value = data.name;
      opt.innerText = data.name;
      distSelect.appendChild(opt);
    });

    let panchSnap = await db.collection("panchayats").get();
    let panchSelect = document.getElementById("regPanchayat");
    panchSnap.forEach(doc => {
      let data = doc.data();
      let opt = document.createElement("option");
      opt.value = data.name;
      opt.innerText = data.name;
      panchSelect.appendChild(opt);
    });
  } catch(err) {
    console.log("ड्रॉपडाउन लोड करने में त्रुटि: ", err);
  }
}

async function submitRegistration(){
  let name = document.getElementById("regName").value.trim();
  let mobile = document.getElementById("regMobile").value.trim();
  let relType = document.getElementById("relationType").value;
  let relName = document.getElementById("regRelationName").value.trim();
  let gotra = document.getElementById("regGotra").value.trim();
  let district = document.getElementById("regDistrict").value;
  let panchayat = document.getElementById("regPanchayat").value;
  let village = document.getElementById("regVillage").value.trim();
  let blood = document.getElementById("regBlood").value;
  let mpin = document.getElementById("regMpin").value.trim();

  if(!name || mobile.length < 10 || !relName || !gotra || !district || !panchayat || !village || mpin.length < 6){
    alert("कृपया सभी अनिवार्य (*) फील्ड सही-सही भरें और 6 अंकों का MPIN बनाएं।");
    return;
  }

  try {
    let checkUser = await db.collection("users").where("mobile", "==", mobile).get();
    if(!checkUser.empty){
      alert("इस मोबाइल नंबर से पहले ही पंजीकरण हो चुका है। कृपया लॉगिन करें।");
      return;
    }

    await db.collection("users").add({
      fullName: name,
      mobile: mobile,
      relationType: relType, // 'पिता का नाम' या 'पति का नाम'
      relationName: relName, // नाम
      gotra: gotra,
      district: district,
      panchayat: panchayat,
      village: village,
      bloodGroup: blood,
      mpin: mpin,
      status: "pending",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("पंजीकरण सफलताપूर्वक हो गया है!\nएडमिन द्वारा सत्यापन (Approval) के बाद आप लॉगिन कर सकेंगे।");
    window.location.href = "login.html";

  } catch(err) {
    alert("पंजीकरण में त्रुटि: " + err.message);
  }
}
</script>
</body>
</html>
