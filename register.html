<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>नया सदस्य पंजीकरण | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#66758a;--line:#e5ebf3;--green:#168c50;--red:#d93025;--shadow:0 10px 28px rgba(20,42,72,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eaf0f7;font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}
#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 50px rgba(0,0,0,0.15);padding-bottom:85px}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px}
.back-btn{background:rgba(255,255,255,0.2);color:#fff;border:0;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;cursor:pointer;text-decoration:none}
.header h1{margin:0;font-size:17px;font-weight:800}
.header p{margin:2px 0 0;font-size:11px;opacity:.8}

.container{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}

.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.form-control{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;background:#fafbfc;color:var(--text);outline:none}
.form-control:focus{border-color:var(--p);background:#fff}

.btn{border:0;border-radius:12px;padding:12px 14px;width:100%;font:700 14px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin-top:8px;box-shadow:0 4px 12px rgba(7,87,163,.18);text-align:center}

.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}

#msg{font-size:12px;text-align:center;margin-top:8px;font-weight:700}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <a href="index.html" class="back-btn">←</a>
    <div>
      <h1>नया सदस्य पंजीकरण</h1>
      <p>भुईहर जाति समाज • महाराजगंज</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <form id="regForm" onsubmit="registerUser(event)">
        <div class="form-group">
          <label>पूरा नाम (सदस्य)</label>
          <input type="text" id="fullName" class="form-control" placeholder="अपना पूरा नाम लिखें" required>
        </div>

        <div class="form-group">
          <label>पिता / पति का नाम</label>
          <input type="text" id="relativeName" class="form-control" placeholder="पिता या पति का नाम" required>
        </div>

        <div class="form-group">
          <label>मोबाईल नंबर (व्हाट्सएप)</label>
          <input type="tel" id="mobile" class="form-control" placeholder="10 अंक का मोबाइल नंबर" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
          <label>गाँव / क्षेत्र</label>
          <input type="text" id="village" class="form-control" value="महाराजगंज" required>
        </div>

        <div class="form-group">
          <label>गोत्र (यदि ज्ञात हो)</label>
          <input type="text" id="gotra" class="form-control" placeholder="गोत्र का नाम लिखें">
        </div>

        <button type="submit" class="btn" id="submitBtn">पंजीकरण जमा करें</button>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

async function registerUser(e){
  e.preventDefault();
  let btn=document.getElementById("submitBtn");
  let msg=document.getElementById("msg");
  btn.disabled=true;
  btn.textContent="सहेज रहा है...";

  let data={
    fullName:document.getElementById("fullName").value,
    relativeName:document.getElementById("relativeName").value,
    mobile:document.getElementById("mobile").value,
    village:document.getElementById("village").value,
    gotra:document.getElementById("gotra").value,
    status:"pending",
    createdAt:new Date().toISOString()
  };

  try{
    await db.collection("users").add(data);
    msg.style.color="var(--green)";
    msg.textContent="पंजीकरण सफलतापूर्वक हो गया! एडमिन अनुमोदन के बाद यह सूची में दिखेगा।";
    document.getElementById("regForm").reset();
    setTimeout(()=>{window.location.href="index.html";},2000);
  }catch(err){
    msg.style.color="var(--red)";
    msg.textContent="त्रुटि: पुनः प्रयास करें।";
    btn.disabled=false;
    btn.textContent="पंजीकरण जमा करें";
  }
}
</script>
</body>
</html>
