<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0757a3">
<title>सदस्य खोज डायरेक्टरी | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--green:#168c50;--red:#d93025;--shadow:0 4px 16px rgba(20,42,72,0.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text)}

#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,0.1);padding-bottom:80px;}

.header{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px;border-radius:0 0 20px 20px;text-align:center;}
.header h1{margin:0;font-size:17px;font-weight:800}
.header p{margin:2px 0 0;font-size:11px;opacity:.85}

.container{padding:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:11.5px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.form-group input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:12px inherit;background:#f9fafb}

.btn{border:0;border-radius:12px;padding:11px;width:100%;font:700 12.5px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 12px rgba(7,87,163,.18);}

.member-item{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px;}
.member-item p{margin:3px 0;}

/* पॉप-अप मोडल */
#restrictionModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;display:none;justify-content:center;align-items:center;padding:16px;}
.modal-content{background:var(--card);width:100%;max-width:320px;border-radius:16px;padding:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.modal-content h3{margin:0 0 8px;color:var(--navy);font-size:16px;}
.modal-content p{margin:0 0 16px;color:var(--muted);font-size:12.5px;line-height:1.4;}
.modal-btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px;width:100%;font:700 12.5px inherit;cursor:pointer;margin-bottom:6px;}
.modal-close{background:#e2e8f0;color:var(--text);border:0;border-radius:10px;padding:8px;width:100%;font:700 12px inherit;cursor:pointer;}

/* बॉटम नेविगेशन */
.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 3px}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:4px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px}
.nav a.active{color:var(--p);font-weight:800}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>🔍 सदस्य खोज डायरेक्टरी</h1>
    <p>समाज के सभी पंजीकृत सदस्यों की सूची</p>
  </div>

  <div class="container">
    
    <!-- खोज बॉक्स -->
    <div class="card">
      <div class="form-group">
        <label>नाम, गोत्र या गाँव द्वारा खोजें</label>
        <input type="text" id="searchInput" placeholder="जैसे: कश्यप या महाराजगंज" onkeyup="filterMembers()">
      </div>
    </div>

    <!-- सदस्य सूची कंटेनर -->
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:13.5px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:6px;">📋 पंजीकृत सदस्य</h3>
      <div id="memberListContainer">
        <p style="font-size:12px;color:var(--muted);text-align:center;">सदस्य सूची लोड हो रही है...</p>
      </div>
    </div>

  </div>

  <!-- रेस्ट्रिक्शन पॉप-अप -->
  <div id="restrictionModal">
    <div class="modal-content">
      <h3>🔒 सुरक्षित जानकारी</h3>
      <p>पूरा नंबर देखने और संपर्क करने के लिए कृपया पहले लॉगिन करें।</p>
      <button class="modal-btn" onclick="window.location.href='login.html'">लॉगिन करें</button>
      <button class="modal-close" onclick="closeModal()">बंद करें</button>
    </div>
  </div>

  <!-- बॉटम नेविगेशन -->
  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html" class="active"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allMembers = [];
let isUserLoggedIn = false;

window.onload = function(){
  let savedMob = localStorage.getItem("userLoggedInMobile");
  if(savedMob) isUserLoggedIn = true;
  loadAllMembers();
}

async function loadAllMembers(){
  let container = document.getElementById("memberListContainer");
  try {
    let snap = await db.collection("users").where("status", "==", "approved").get();
    if(snap.empty){
      container.innerHTML = "<p style='font-size:12px;color:var(--muted);text-align:center;'>कोई सक्रिय सदस्य नहीं मिला।</p>";
      return;
    }
    allMembers = [];
    snap.forEach(doc => {
      allMembers.push(doc.data());
    });
    renderMemberList(allMembers);
  } catch(err) {
    container.innerHTML = "<p style='font-size:12px;color:var(--red);text-align:center;'>लोड करने में त्रुटि।</p>";
  }
}

function renderMemberList(list){
  let container = document.getElementById("memberListContainer");
  container.innerHTML = "";

  if(list.length === 0){
    container.innerHTML = "<p style='font-size:12px;color:var(--muted);text-align:center;'>कोई परिणाम नहीं मिला।</p>";
    return;
  }

  list.forEach(m => {
    let div = document.createElement("div");
    div.className = "member-item";

    let displayMob = m.mobile;
    let actionHTML = "";

    if(isUserLoggedIn){
      actionHTML = `<a href="tel:${m.mobile}" style="background:var(--green);color:#fff;padding:3px 8px;border-radius:4px;text-decoration:none;font-size:10.5px;font-weight:700;">📞 कॉल</a>`;
    } else {
      displayMob = m.mobile ? m.mobile.substring(0, 4) + "xxxxxx" : "xxxxxx";
      actionHTML = `<button onclick="showModal()" style="background:#e2e8f0;color:var(--navy);border:0;padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:700;cursor:pointer;">🔒 देखें</button>`;
    }

    div.innerHTML = `
      <p><b>नाम:</b> ${m.fullName || '-'}</p>
      <p><b>गोत्र:</b> ${m.gotra || '-'} | <b>ग्राम:</b> ${m.village || '-'}</p>
      <p><b>जिला:</b> ${m.district || '-'} | <b>मोबाइल:</b> ${displayMob} ${actionHTML}</p>
    `;
    container.appendChild(div);
  });
}

function filterMembers(){
  let query = document.getElementById("searchInput").value.toLowerCase();
  let filtered = allMembers.filter(m => {
    let name = (m.fullName || "").toLowerCase();
    let gotra = (m.gotra || "").toLowerCase();
    let village = (m.village || "").toLowerCase();
    let dist = (m.district || "").toLowerCase();
    return name.includes(query) || gotra.includes(query) || village.includes(query) || dist.includes(query);
  });
  renderMemberList(filtered);
}

function showModal(){
  document.getElementById("restrictionModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("restrictionModal").style.display = "none";
}
</script>
</body>
</html>
