<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,minimum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#0757a3">
<title>एडवांस्ड समाज डायरेक्टरी एवं खोज | भुईहर जाति समाज</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--shadow:0 10px 30px rgba(20,42,72,0.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,0.1);padding-bottom:25px;}

.hero{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px 18px 24px;border-radius:0 0 28px 28px;position:relative;box-shadow:0 10px 20px rgba(7,87,163,0.15);}

.back-btn-wrap{padding:4px 0 12px 0;}
.custom-back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.38);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;text-decoration:none;backdrop-filter:blur(4px)}

.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.brand h1{margin:0;font-size:17.5px;font-weight:800}.brand p{margin:2px 0 0;font-size:11.5px;opacity:.9}

.container{padding:16px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

.search-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:4px}
.form-control{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:13px inherit;background:#fafbfc;outline:none}
.form-control:focus{border-color:var(--p)}

.btn{border:0;border-radius:14px;padding:12px 16px;width:100%;font:700 14px inherit;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(7,87,163,0.25);text-align:center;text-decoration:none;display:inline-block;margin-top:4px}
.btn:active{transform:scale(0.98)}

.member-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;display:flex;justify-content:space-between;align-items:center}
.member-info b{display:block;font-size:15px;color:var(--navy);margin-bottom:3px}
.member-info span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.member-badge{position:absolute;top:14px;right:14px;background:#eff6ff;color:var(--p);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}

.contact-actions{display:flex;gap:6px;margin-top:8px}
.action-btn{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;text-decoration:none;display:inline-block;}
.call-btn{background:#e0f2fe;color:#0369a1}
.wa-btn{background:#dcfce7;color:#15803d}
</style>
</head>
<body>

<div id="app">
  <div class="hero">
    <div class="back-btn-wrap">
      <a href="javascript:void(0);" onclick="goBackHome()" class="custom-back-btn">
        <span style="font-size:16px;">←</span> मुख्य पृष्ठ (वापस जाएं)
      </a>
    </div>

    <div class="brand">
      <div class="logo">🔍</div>
      <div><h1>एडवांस्ड समाज डायरेक्टरी</h1><p>स्मार्ट मल्टी-फिल्टर सदस्य खोज इंजन</p></div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:14px;color:var(--navy);">⚡ एडवांस्ड फिल्टर खोज</h3>
      
      <div class="search-grid">
        <div class="form-group">
          <label>सदस्य का नाम / पिता का नाम</label>
          <input type="text" id="searchName" class="form-control" placeholder="जैसे: राहुल या रामप्रसाद">
        </div>
        <div class="form-group">
          <label>गोत्र (Gotra)</label>
          <input type="text" id="searchGotra" class="form-control" placeholder="जैसे: कश्यप, वत्स...">
        </div>
        <div class="form-group">
          <label>निवास / ग्राम (Village)</label>
          <input type="text" id="searchVillage" class="form-control" placeholder="जैसे: महाराजगंज">
        </div>
        <div class="form-group">
          <label>रक्त समूह (Blood Group)</label>
          <select id="searchBlood" class="form-control">
            <option value="">-- सभी ब्लड ग्रुप --</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
          </select>
        </div>
      </div>

      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:2;" onclick="performAdvancedSearch()">🔍 स्मार्ट खोज करें</button>
        <button class="btn" style="flex:1; background:#64748b; box-shadow:0 6px 16px rgba(100,116,139,0.25);" onclick="resetSearchFilters()">रीसेट</button>
      </div>
    </div>

    <div id="searchStats" style="font-size:12px; color:var(--muted); margin:0 4px 8px; font-weight:700; display:none;"></div>

    <div id="searchResultsContainer">
      <div class="card" style="text-align:center;color:var(--muted);font-size:12.5px;padding:22px;">
        कृपया ऊपर फ़ील्ड्स में जानकारी भरकर 'स्मार्ट खोज करें' बटन दबाएँ।
      </div>
    </div>
  </div>
</div>

<!-- प्रीमियम पॉप-अप मॉडल -->
<div id="customModalOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2, 6, 23, 0.7); backdrop-filter:blur(8px); z-index:99999; display:none; align-items:center; justify-content:center; opacity:0; transition:opacity 0.3s ease;">
    <div id="customModalBox" style="background:#ffffff; width:90%; max-width:330px; border-radius:28px; padding:24px 20px 20px; text-align:center; position:relative; box-shadow:0 20px 40px rgba(0,0,0,0.3); transform:scale(0.8); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);">
        <button onclick="closeCustomModal(false)" style="position:absolute; top:16px; right:16px; background:#f1f5f9; border:none; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:#64748b; display:grid; place-items:center;">✕</button>
        <div style="position:relative; width:64px; height:64px; margin:-50px auto 16px; background:linear-gradient(135deg, #2563eb, #a855f7); border-radius:50%; display:grid; place-items:center; box-shadow:0 10px 20px rgba(37,99,235,0.4); border:4px solid #fff;">
            <span style="font-size:28px;">⚠️</span>
        </div>
        <h3 id="customModalTitle" style="font-size:17px; font-weight:800; color:#1e293b; margin:0 0 8px;">सुरक्षा चेतावनी</h3>
        <p id="customModalMessage" style="font-size:13px; color:#64748b; margin:0 0 24px; line-height:1.5;">कृपया आगे बढ़ने के लिए लॉगिन करें।</p>
        <div style="display:flex; gap:10px;">
            <button onclick="closeCustomModal(false)" style="flex:1; padding:12px; background:#f1f5f9; color:#475569; font-weight:700; border:none; border-radius:16px; cursor:pointer; font-size:14px;">बंद करें</button>
            <button id="customModalActionBtn" onclick="closeCustomModal(true)" style="flex:1; padding:12px; background:linear-gradient(135deg, #2563eb, #d946ef); color:#fff; font-weight:700; border:none; border-radius:16px; cursor:pointer; font-size:14px; box-shadow:0 4px 12px rgba(37,99,235,0.3); display:none;">लॉगिन करें</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function goBackHome() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
}

let allMembersCache = [];
let modalCallback = null;

function showCustomAlert(title, message, callback, showLoginBtn = false) {
    document.getElementById('customModalTitle').innerText = title;
    document.getElementById('customModalMessage').innerText = message;
    modalCallback = callback;

    let actionBtn = document.getElementById('customModalActionBtn');
    if(showLoginBtn) {
        actionBtn.style.display = 'block';
    } else {
        actionBtn.style.display = 'none';
    }

    let overlay = document.getElementById('customModalOverlay');
    let box = document.getElementById('customModalBox');
    overlay.style.display = 'flex';
    setTimeout(() => {
        overlay.style.opacity = '1';
        box.style.transform = 'scale(1)';
    }, 10);
}

function closeCustomModal(isYes) {
    let overlay = document.getElementById('customModalOverlay');
    let box = document.getElementById('customModalBox');
    overlay.style.opacity = '0';
    box.style.transform = 'scale(0.8)';
    setTimeout(() => {
        overlay.style.display = 'none';
        if (modalCallback) {
            modalCallback(isYes);
            modalCallback = null;
        }
    }, 300);
}

window.alert = function(message) {
    showCustomAlert("सूचना", message, function(yes) {});
};

async function fetchAllMembers() {
  if(allMembersCache.length > 0) return allMembersCache;
  try {
    let snap = await db.collection("users").get();
    allMembersCache = [];
    snap.forEach(doc => {
      let d = doc.data();
      if(!d.status || d.status === "approved") {
        allMembersCache.push(d);
      }
    });
    return allMembersCache;
  } catch(e) {
    return [];
  }
}

async function performAdvancedSearch() {
  let nameKey = document.getElementById("searchName").value.trim().toLowerCase();
  let gotraKey = document.getElementById("searchGotra").value.trim().toLowerCase();
  let villageKey = document.getElementById("searchVillage").value.trim().toLowerCase();
  let bloodKey = document.getElementById("searchBlood").value;

  let container = document.getElementById("searchResultsContainer");
  let statsDiv = document.getElementById("searchStats");

  if(!nameKey && !gotraKey && !villageKey && !bloodKey) {
    alert("⚠️ कृपया कम से कम एक खोज मापदंड (नाम, गोत्र, ग्राम या ब्लड ग्रुप) दर्ज करें!");
    return;
  }

  container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:12.5px;padding:22px;">स्मार्ट डेटाबेस से खोज जारी है...</div>`;
  statsDiv.style.display = "none";

  let members = await fetchAllMembers();

  let results = members.filter(m => {
    let fName = (m.FullName || m.fullName || "").toLowerCase();
    let fFather = (m.fatherName || "").toLowerCase();
    let fGotra = (m.gothra || m.gotra || "").toLowerCase();
    let fVillage = (m.village || m.address || "").toLowerCase();
    let fBlood = (m.bloodGroup || "").trim();

    let matchName = !nameKey || fName.includes(nameKey) || fFather.includes(nameKey);
    let matchGotra = !gotraKey || fGotra.includes(gotraKey);
    let matchVillage = !villageKey || fVillage.includes(villageKey);
    let matchBlood = !bloodKey || fBlood.toUpperCase() === bloodKey.toUpperCase();

    return matchName && matchGotra && matchVillage && matchBlood;
  });

  statsDiv.style.display = "block";
  statsDiv.innerText = `📊 कुल ${results.length} सदस्य मेल खाते मिले।`;

  if(results.length === 0) {
    container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:12.5px;padding:22px;">कोई भी मेल खाता हुआ सदस्य नहीं मिला। कृपया अपने फ़िल्टर बदलकर पुनः प्रयास करें।</div>`;
    return;
  }

  let loggedMobile = localStorage.getItem("userLoggedInMobile");
  let html = "";

  results.forEach(m => {
    let mobileNum = m.mobileNumber || m.mobile || "9876543210";
    let contactAction = "";

    if(loggedMobile) {
      let waText = encodeURIComponent(`नमस्ते ${m.FullName || m.fullName || 'सजातीय बंधु'}, मैंने भुईहर समाज पोर्टल की एडवांस्ड डायरेक्टरी में आपकी प्रोफाइल देखी है।`);
      contactAction = `
        <div class="contact-actions">
          <a href="tel:${mobileNum}" class="action-btn call-btn">📞 ${mobileNum}</a>
          <a href="https://wa.me/91${mobileNum}?text=${waText}" target="_blank" class="action-btn wa-btn">💬 WhatsApp</a>
        </div>
      `;
    } else {
      contactAction = `
        <div style="margin-top:6px;">
          <button onclick="promptLoginForSearch()" style="background:#f1f5f9;color:var(--muted);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;border:none;cursor:pointer;">🔒 संपर्क नंबर हेतु लॉगिन करें</button>
        </div>
      `;
    }

    html += `
      <div class="member-card">
        <div class="member-badge">${m.bloodGroup && m.bloodGroup !== "उल्लिखित नहीं" ? '🩸 ' + m.bloodGroup : 'भुईहर समाज'}</div>
        <div class="member-info">
          <b>${m.FullName || m.fullName || 'सुरक्षित सदस्य'}</b>
          <span>पिता/पति: ${m.fatherName || 'लागू नहीं'} • गोत्र: ${m.gothra || m.gotra || 'सामान्य'}</span>
          <span>निवास: ${m.village || m.address || 'महाराजगंज, बलरामपुर'}</span>
          ${contactAction}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function resetSearchFilters() {
  document.getElementById("searchName").value = "";
  document.getElementById("searchGotra").value = "";
  document.getElementById("searchVillage").value = "";
  document.getElementById("searchBlood").value = "";
  document.getElementById("searchResultsContainer").innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:12.5px;padding:22px;">कृपया ऊपर फ़ील्ड्स में जानकारी भरकर 'स्मार्ट खोज करें' बटन दबाएँ।</div>`;
  document.getElementById("searchStats").style.display = "none";
}

function promptLoginForSearch() {
  showCustomAlert("⚠️ सुरक्षा चेतावनी", "सदस्य का संपर्क नंबर देखने के लिए कृपया पहले अपने मोबाइल नंबर और MPIN से लॉगिन करें!", function(yes) {
    if(yes) {
      window.location.href = "login.html";
    }
  }, true);
}

// Pre-cache members on load
fetchAllMembers();
</script>
</body>
</html>
