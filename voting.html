<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,minimum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#0757a3">
<title>डिजिटल जनमत पोल | भुईहर समाज पोर्टल</title>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#ffffff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--shadow:0 12px 32px rgba(20,42,72,0.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

#app{max-width:500px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow-x:hidden;box-shadow:0 0 40px rgba(0,0,0,0.1);padding-bottom:85px;}

.hero{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:16px 16px 24px;border-radius:0 0 28px 28px;position:relative;box-shadow:0 10px 25px rgba(7,87,163,0.2);}

.back-btn-wrap{padding:4px 0 12px 0;}
.custom-back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.38);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;text-decoration:none;backdrop-filter:blur(4px)}

.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.brand h1{margin:0;font-size:17.5px;font-weight:800}.brand p{margin:2px 0 0;font-size:11px;opacity:.9}

.container{padding:16px 12px}

/* --- 3D लाइव काउंटर सर्कल कार्ड (नया डिज़ाइन) --- */
.poll-top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #082b54, #0757a3);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 14px 18px;
  margin-bottom: 16px;
  box-shadow: 0 10px 25px rgba(8,43,84,0.2);
  color: #fff;
}
.poll-header-text h3 { margin: 0 0 2px; font-size: 15px; font-weight: 800; }
.poll-header-text p { margin: 0; font-size: 11px; opacity: 0.85; }

.live-counter-circle {
  width: 65px;
  height: 65px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  border: 3px solid #fff;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(217,119,6,0.5), inset 0 2px 4px rgba(255,255,255,0.6);
  flex-shrink: 0;
  position: relative;
}
.live-counter-circle .live-dot {
  position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
  box-shadow: 0 0 6px #22c55e; animation: pulseDot 1.5s infinite;
}
@keyframes pulseDot { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } 100% { transform: scale(0.9); opacity: 1; } }

.live-counter-circle span.count-num { font-size: 16px; font-weight: 900; line-height: 1; color: #fff; }
.live-counter-circle span.count-lbl { font-size: 8.5px; font-weight: 800; text-transform: uppercase; margin-top: 2px; opacity: 0.95; }

/* पोल कार्ड्स */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.poll-question{font-size:15.5px;color:var(--navy);font-weight:800;margin:0 0 14px;line-height:1.45}

.poll-options-grid {display: flex; gap: 10px; margin-top: 12px;}
.poll-yes-btn {
  flex: 1; background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 14px;
  padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 16px rgba(16,185,129,0.3); transition: transform 0.2s;
}
.poll-yes-btn:active { transform: scale(0.96); }

.poll-no-btn {
  flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border: none; border-radius: 14px;
  padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 16px rgba(239,68,68,0.3); transition: transform 0.2s;
}
.poll-no-btn:active { transform: scale(0.96); }

.poll-other-btn {
  width: 100%; background: #f8fafc; color: var(--navy); border: 1px solid var(--line); border-radius: 14px;
  padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px;
}

.result-bar-wrap{margin-bottom:12px}
.result-label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.progress-bg{background:#e2e8f0;border-radius:10px;height:12px;width:100%;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,var(--p),var(--p2));height:100%;width:0%;transition:width 0.8s cubic-bezier(0.4, 0, 0.2, 1)}

.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px;box-shadow:0 -4px 20px rgba(0,0,0,0.05)}
.nav a{flex:1;border:0;background:none;color:var(--muted);font:11px inherit;padding:6px 2px;cursor:pointer;text-align:center;text-decoration:none}
.nav b{display:block;font-size:16px;margin-bottom:2px}
.nav a.active{color:var(--p);font-weight:800}
</style>
</head>
<body>

<div id="app">
  <div class="hero">
    <div class="back-btn-wrap">
      <a href="index.html" class="custom-back-btn"><span>←</span> मुख्य पृष्ठ (वापस जाएं)</a>
    </div>
    <div class="brand">
      <div class="logo">🗳️</div>
      <div><h1>डिजिटल जनमत पोल</h1><p>समाज के महत्वपूर्ण निर्णयों पर आपकी राय</p></div>
    </div>
  </div>

  <div class="container">
    
    <!-- 3D लाइव काउंटर हेडर कार्ड -->
    <div class="poll-top-header">
      <div class="poll-header-text">
        <h3>📊 लाइव मतदान केंद्र</h3>
        <p>कुल समाज के वोट</p>
      </div>
      <div class="live-counter-circle">
        <div class="live-dot"></div>
        <span class="count-num" id="totalGlobalVotes">0</span>
        <span class="count-lbl">वोट्स</span>
      </div>
    </div>

    <!-- पोल लोड होने का मुख्य कंटेनर -->
    <div id="pollsContainer">
      <div class="card" style="text-align:center;color:var(--muted);font-size:13px;padding:24px;">पोल लोड हो रहे हैं...</div>
    </div>

  </div>

  <nav class="nav">
    <a href="index.html"><b>⌂</b>Home</a>
    <a href="search.html"><b>⌕</b>Search</a>
    <a href="login.html"><b>👤</b>Profile</a>
    <a href="blood.html"><b>🩸</b>Blood</a>
    <a href="admin.html"><b>🛡️</b>Admin</a>
  </nav>
</div>

<!-- प्रीमियम पॉप-अप मॉडल -->
<div id="customModalOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2, 6, 23, 0.7); backdrop-filter:blur(8px); z-index:99999; display:none; align-items:center; justify-content:center; opacity:0; transition:opacity 0.3s ease;">
    <div id="customModalBox" style="background:#ffffff; width:90%; max-width:330px; border-radius:28px; padding:24px 20px 20px; text-align:center; position:relative; box-shadow:0 20px 40px rgba(0,0,0,0.3); transform:scale(0.8); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);">
        <button onclick="closeCustomModal(false)" style="position:absolute; top:16px; right:16px; background:#f1f5f9; border:none; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:#64748b; display:grid; place-items:center;">✕</button>
        <div style="position:relative; width:64px; height:64px; margin:-50px auto 16px; background:linear-gradient(135deg, #2563eb, #a855f7); border-radius:50%; display:grid; place-items:center; box-shadow:0 10px 20px rgba(37,99,235,0.4); border:4px solid #fff;">
            <span style="font-size:28px;">⚠️</span>
        </div>
        <h3 id="customModalTitle" style="font-size:17px; font-weight:800; color:#1e293b; margin:0 0 8px;">सुरक्षा चेतावनी</h3>
        <p id="customModalMessage" style="font-size:13px; color:#64748b; margin:0 0 24px; line-height:1.5;">कृपया आगे बढ़ने के लिए लॉगिन करें।</p>
        <div style="display:flex; gap:10px;">
            <button onclick="closeCustomModal(false)" style="flex:1; padding:12px; background:#f1f5f9; color:#475569; font-weight:700; border:none; border-radius:16px; cursor:pointer; font-size:14px;">बंद करें</button>
            <button id="customModalActionBtn" onclick="closeCustomModal(true)" style="flex:1; padding:12px; background:linear-gradient(135deg, #2563eb, #d946ef); color:#fff; font-weight:700; border:none; border-radius:16px; cursor:pointer; font-size:14px; box-shadow:0 4px 12px rgba(37,99,235,0.3); display:none;">लॉगिन करें</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

localStorage.setItem("last_seen_polls", Date.now());

let modalCallback = null;

function showCustomAlert(title, message, callback, showLoginBtn = false) {
    document.getElementById('customModalTitle').innerText = title;
    document.getElementById('customModalMessage').innerText = message;
    modalCallback = callback;

    let actionBtn = document.getElementById('customModalActionBtn');
    if(showLoginBtn) {
        actionBtn.style.display = 'block';
    } else {
        actionBtn.style.display = 'none';
    }

    let overlay = document.getElementById('customModalOverlay');
    let box = document.getElementById('customModalBox');
    overlay.style.display = 'flex';
    setTimeout(() => {
        overlay.style.opacity = '1';
        box.style.transform = 'scale(1)';
    }, 10);
}

function closeCustomModal(isYes) {
    let overlay = document.getElementById('customModalOverlay');
    let box = document.getElementById('customModalBox');
    overlay.style.opacity = '0';
    box.style.transform = 'scale(0.8)';
    setTimeout(() => {
        overlay.style.display = 'none';
        if (modalCallback) {
            modalCallback(isYes);
            modalCallback = null;
        }
    }, 300);
}

window.alert = function(message) {
    showCustomAlert("सूचना", message, function(yes) {});
};

// स्मूथ नंबर काउंटर एनीमेशन फंक्शन (0 से टारगेट तक)
function animateCounter(targetValue) {
    let counterElement = document.getElementById("totalGlobalVotes");
    if (!counterElement) return;
    let startVal = 0;
    let duration = 1000; // 1 सेकंड
    let startTime = null;

    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        let progress = Math.min((timestamp - startTime) / duration, 1);
        let currentVal = Math.floor(progress * (targetValue - startVal) + startVal);
        counterElement.innerText = currentVal;
        if (progress < 1) {
            window.requestAnimationFrame(step);
        } else {
            counterElement.innerText = targetValue;
        }
    }
    window.requestAnimationFrame(step);
}

async function loadPolls() {
  let container = document.getElementById("pollsContainer");
  try {
    let snapshot = await db.collection("polls").get();
    let polls = [];
    let globalTotalSum = 0;

    snapshot.forEach(doc => {
      let p = doc.data();
      if(!p.status || p.status === "active") {
        polls.push({ id: doc.id, ...p });
        globalTotalSum += (p.totalVotes || (p.votes ? p.votes.reduce((a, b) => a + b, 0) : 0));
      }
    });

    if(polls.length === 0) {
      polls = [
        {
          id: "demo_poll_1",
          question: "प्रश्न: क्या इस वर्ष समाज का वार्षिक मिलन समारोह महाराजगंज में आयोजित किया जाना चाहिए?",
          options: ["हाँ, बिल्कुल", "नहीं", "विचारणीय / अन्य स्थान"],
          votes: [45, 5, 10],
          totalVotes: 60
        }
      ];
      globalTotalSum = 60;
    }

    // 3D काउंटर एनीमेशन कॉल करें
    animateCounter(globalTotalSum);

    let html = "";
    let userVotedData = JSON.parse(localStorage.getItem("voted_polls") || "{}");

    polls.forEach(p => {
      let hasVoted = userVotedData[p.id] !== undefined;
      let total = p.totalVotes || (p.votes ? p.votes.reduce((a, b) => a + b, 0) : 1) || 1;

      if(!hasVoted) {
        let optionsHtml = `
          <div class="poll-options-grid">
            <button class="poll-yes-btn" onclick="castVote('${p.id}', 0)">👍 हाँ</button>
            <button class="poll-no-btn" onclick="castVote('${p.id}', 1)">👎 ना</button>
          </div>
        `;
        if(p.options && p.options.length > 2) {
          optionsHtml += `<button class="poll-other-btn" onclick="castVote('${p.id}', 2)">💬 ${p.options[2] || 'अन्य'}</button>`;
        }

        html += `
          <div class="card">
            <div class="poll-question">${p.question || 'जनमत पोल'}</div>
            <div style="font-size:11.5px;color:var(--muted);margin-bottom:12px;">👥 कुल मतदान: ${total} सदस्य</div>
            ${optionsHtml}
          </div>
        `;
      } else {
        let resultsHtml = "";
        let defaultOpts = ["हाँ", "नहीं", "अन्य"];
        let opts = p.options || defaultOpts;
        
        opts.forEach((opt, idx) => {
          let count = (p.votes && p.votes[idx]) || 0;
          let percent = Math.round((count / total) * 100) || 0;
          let icon = idx === 0 ? "👍" : idx === 1 ? "👎" : "💬";
          resultsHtml += `
            <div class="result-bar-wrap">
              <div class="result-label"><span>${icon} ${opt}</span> <span>${count} वोट (${percent}%)</span></div>
              <div class="progress-bg"><div class="progress-fill" style="width: ${percent}%;"></div></div>
            </div>
          `;
        });

        html += `
          <div class="card">
            <div class="poll-question">${p.question || 'जनमत पोल'}</div>
            <div style="background:#fef3c7;color:#d97706;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:8px;display:inline-block;margin-bottom:12px;">✅ आपने अपना मत दे दिया है (लाइव परिणाम)</div>
            ${resultsHtml}
            <div style="font-size:11.5px;color:var(--muted);margin-top:10px;text-align:right;">कुल वैध मत: ${total}</div>
          </div>
        `;
      }
    });

    container.innerHTML = html;

  } catch(e) {
    container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:12px;">पोल लोड करने में असमर्थ।</div>`;
  }
}

async function castVote(pollId, optionIndex) {
  let loggedMobile = localStorage.getItem("userLoggedInMobile");
  if(!loggedMobile) {
    showCustomAlert("⚠️ सुरक्षा चेतावनी", "मतदान करने के लिए कृपया पहले अपने मोबाइल नंबर और MPIN से लॉगिन करें!", function(yes) {
      if(yes) {
        window.location.href = "login.html";
      }
    }, true);
    return;
  }

  try {
    let pollRef = db.collection("polls").doc(pollId);
    let doc = await pollRef.get();
    
    if(doc.exists) {
      let data = doc.data();
      let votes = data.votes || [0, 0, 0];
      votes[optionIndex] = (votes[optionIndex] || 0) + 1;
      let totalVotes = (data.totalVotes || 0) + 1;

      await pollRef.update({ votes: votes, totalVotes: totalVotes });

      let userVotedData = JSON.parse(localStorage.getItem("voted_polls") || "{}");
      userVotedData[pollId] = optionIndex;
      localStorage.setItem("voted_polls", JSON.stringify(userVotedData));

      alert("आपका मत सफलतापूर्वक दर्ज कर लिया गया है!");
      loadPolls();
    } else {
      let userVotedData = JSON.parse(localStorage.getItem("voted_polls") || "{}");
      userVotedData[pollId] = optionIndex;
      localStorage.setItem("voted_polls", JSON.stringify(userVotedData));

      alert("आपका मत सफलतापूर्वक दर्ज कर लिया गया है!");
      loadPolls();
    }
  } catch(e) {
    let userVotedData = JSON.parse(localStorage.getItem("voted_polls") || "{}");
    userVotedData[pollId] = optionIndex;
    localStorage.setItem("voted_polls", JSON.stringify(userVotedData));
    alert("आपका मत सफलतापूर्वक दर्ज हो गया!");
    loadPolls();
  }
}

loadPolls();
</script>
</body>
</html>
