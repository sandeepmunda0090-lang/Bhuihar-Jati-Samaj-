<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,minimum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#0757a3">
<title>जनमत पोल | भुईहर समाज पोर्टल</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--shadow:0 8px 24px rgba(20,42,72,0.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  position:relative;
  overflow-x:hidden;
  box-shadow:0 0 40px rgba(0,0,0,0.1);
  padding-bottom:25px;
  animation: pagePop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
}
@keyframes pagePop {
  0% { opacity: 0; transform: scale(0.94) translateY(15px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.hero{background:linear-gradient(145deg,var(--navy),var(--p),var(--p2));color:#fff;padding:14px 16px 22px;border-radius:0 0 24px 24px;position:relative;}
.back-btn-wrap{padding:4px 0 12px 0;}
.custom-back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.38);color:#fff;padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:700;text-decoration:none;backdrop-filter:blur(4px)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.brand h1{margin:0;font-size:17px}.brand p{margin:2px 0 0;font-size:11px;opacity:.88}
.container{padding:16px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.poll-title{font-size:15px;color:var(--navy);font-weight:900;margin:0 0 8px}
.option-btn{display:block;width:100%;padding:12px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:#f8fafc;font:700 13px inherit;color:var(--navy);cursor:pointer;text-align:left;transition:all 0.2s;}
.option-btn:hover{border-color:var(--p);background:#eff6ff;}
.swal2-container { z-index: 100000 !important; }
</style>
</head>
<body>

<div id="app">
  <div class="hero">
    <div class="back-btn-wrap">
      <a href="javascript:void(0);" onclick="goBackHome()" class="custom-back-btn"><span>←</span> मुख्य पृष्ठ (वापस जाएं)</a>
    </div>
    <div class="brand">
      <div class="logo">📊</div>
      <div><h1>जनमत पोल (Voting Poll)</h1><p>समाज के महत्वपूर्ण विषयों पर आपकी राय</p></div>
    </div>
  </div>

  <div class="container">
    <div id="pollContainer">
      <div class="card" style="text-align:center;color:var(--muted);font-size:12px;padding:20px;">लाइव पोल लोड हो रहे हैं...</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function goBackHome() {
  if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html'; }
}

async function loadActivePolls() {
  let container = document.getElementById("pollContainer");
  let loggedMobile = localStorage.getItem("userLoggedInMobile");

  try {
    let snap = await db.collection("polls").where("status", "==", "active").get();
    if(snap.empty) {
      container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:12px;padding:20px;">फिलहाल कोई सक्रिय जनमत पोल उपलब्ध नहीं है।</div>`;
      return;
    }

    let html = "";
    snap.forEach(doc => {
      let p = doc.data();
      let pollId = doc.id;
      let votes = p.votes || {}; 
      let hasVoted = loggedMobile && votes[loggedMobile] !== undefined;

      let optionsHtml = "";
      let totalVotes = Object.keys(votes).length;

      p.options.forEach((opt, index) => {
        let count = 0;
        Object.values(votes).forEach(val => { if(val === index) count++; });
        let percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;

        if(!hasVoted) {
          optionsHtml += `<button class="option-btn" onclick="submitVote('${pollId}', ${index})">${opt}</button>`;
        } else {
          optionsHtml += `
            <div style="margin:10px 0;">
              <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--navy); margin-bottom:4px;">
                <span>${opt}</span><span>${count} वोट (${percent}%)</span>
              </div>
              <div style="background:#e2e8f0; border-radius:8px; height:10px; overflow:hidden;">
                <div style="background:var(--p); width:${percent}%; height:100%; transition:width 0.4s;"></div>
              </div>
            </div>
          `;
        }
      });

      html += `
        <div class="card">
          <div style="font-size:10px; color:var(--p); font-weight:800; margin-bottom:4px;">📊 लाइव जनमत सर्वेक्षण</div>
          <h3 class="poll-title">${p.question}</h3>
          <p style="font-size:11px; color:var(--muted); margin:0 0 12px;">कुल मतदान: ${totalVotes} सदस्य</p>
          ${optionsHtml}
          ${hasVoted ? '<div style="margin-top:12px; text-align:center; font-size:11.5px; color:#16a34a; font-weight:bold;">✅ आपने इस पोल में अपना मत दे दिया है।</div>' : ''}
        </div>
      `;
    });
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = `<div class="card" style="text-align:center;color:red;font-size:12px;padding:20px;">पोल लोड करने में त्रुटि हुई।</div>`;
  }
}

async function submitVote(pollId, optionIndex) {
  let loggedMobile = localStorage.getItem("userLoggedInMobile");
  if(!loggedMobile) {
    Swal.fire({
      icon: 'warning',
      title: 'लॉगिन आवश्यक है',
      text: 'जनमत पोल में वोट देने के लिए कृपया पहले अपने खाते में लॉगिन करें!',
      confirmButtonColor: '#0757a3',
      confirmButtonText: 'लॉगिन करें'
    }).then((result) => {
      if (result.isConfirmed) {
        window.location.href = "login.html";
      }
    });
    return;
  }

  try {
    let docRef = db.collection("polls").doc(pollId);
    let doc = await docRef.get();
    if(doc.exists) {
      let data = doc.data();
      let votes = data.votes || {};
      votes[loggedMobile] = optionIndex; 
      
      await docRef.update({ votes: votes });
      Swal.fire({ icon: 'success', title: 'मतदान सफल!', text: 'आपका मत सफलतापूर्वक दर्ज कर लिया गया है।', timer: 1500, showConfirmButton: false });
      loadActivePolls();
    }
  } catch(e) {
    Swal.fire({ icon: 'error', title: 'त्रुटि', text: 'मतदान दर्ज करने में समस्या आई।', confirmButtonColor: '#dc2626' });
  }
}

loadActivePolls();
</script>
</body>
</html>
