<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,minimum-scale=1.0,user-scalable=yes">
<meta name="theme-color" content="#0757a3">
<title>जनमत पोल | भुईहर जाति समाज</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--p:#0757a3;--p2:#0d7bd3;--navy:#082b54;--gold:#f4b63f;--bg:#f2f6fc;--card:#fff;--text:#152238;--muted:#66758a;--line:#e2e8f0;--green:#0c9b65;--red:#e34c5b;--shadow:0 12px 32px rgba(8,43,84,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 15% 10%,#e2efff 0,transparent 32%),var(--bg);font-family:system-ui,"Noto Sans Devanagari",Arial,sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:520px;min-height:100vh;margin:0 auto;background:transparent;position:relative;overflow-x:clip;padding-bottom:28px}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#082b54 0%,#0757a3 54%,#0d7bd3 100%);color:#fff;padding:14px 16px 25px;border-radius:0 0 27px 27px;box-shadow:0 14px 30px #0757a326}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none;animation:floatOrb 7s ease-in-out infinite}
.hero:before{width:180px;height:180px;right:-55px;top:-75px;background:radial-gradient(circle at 35% 35%,#ffffff55,#ffffff05 70%);border:1px solid #ffffff25}
.hero:after{width:100px;height:100px;right:85px;bottom:-65px;background:#ffffff10;animation-delay:-3s}
.back-btn-wrap{padding:2px 0 15px}
.custom-back-btn{display:inline-flex;align-items:center;gap:7px;background:#ffffff20;border:1px solid #ffffff50;color:#fff;padding:8px 13px;border-radius:22px;font-size:12px;font-weight:750;text-decoration:none;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:49px;height:49px;flex:0 0 49px;border-radius:16px;background:linear-gradient(145deg,#fff,#eaf3ff);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 18px #001a3b55;transform:rotate(-4deg);animation:logoBob 3.5s ease-in-out infinite}.brand h1{margin:0;font-size:18px;letter-spacing:.1px}.brand p{margin:4px 0 0;font-size:11px;opacity:.9;line-height:1.5}
.intro{padding:17px 14px 2px}.intro h2{font-size:18px;color:var(--navy);margin:0 0 5px}.intro p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.container{padding:13px 12px}.poll-card{position:relative;isolation:isolate;background:linear-gradient(150deg,#fff 0%,#fbfdff 100%);border:1px solid #e0e9f5;border-radius:21px;padding:17px 15px;margin-bottom:15px;box-shadow:var(--shadow);overflow:hidden;animation:cardEnter .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s,box-shadow .25s}
.poll-card:before{content:"";position:absolute;z-index:-1;width:170px;height:170px;right:-85px;top:-95px;border-radius:50%;background:radial-gradient(circle,#dcecff 0,#eff6ff77 60%,transparent 70%)}
.poll-card:after{content:"";position:absolute;z-index:-1;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,var(--gold),var(--p2));opacity:.9}
.poll-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.live-label{display:inline-flex;align-items:center;gap:6px;background:#eaf8f1;color:#087b50;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:850;letter-spacing:.2px}.live-dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px #10b98120;animation:pulse 1.6s infinite}.poll-number{font-size:10px;color:#708198;font-weight:750}
.poll-title{font-size:16px;color:var(--navy);font-weight:900;line-height:1.55;margin:0 0 8px;overflow-wrap:anywhere}.poll-desc{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 15px}.vote-count-line{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f3f7fc;border:1px solid #e5edf7;border-radius:12px;padding:10px 11px;margin:12px 0 14px}.vote-count-line span{font-size:11px;color:var(--muted);font-weight:700}.vote-count-line strong{font-size:17px;color:var(--navy);font-variant-numeric:tabular-nums}
.vote-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vote-btn{min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:15px 9px 13px;border:1px solid transparent;border-radius:17px;color:#fff;font:700 14px system-ui,"Noto Sans Devanagari",sans-serif;cursor:pointer;box-shadow:0 8px 0 #00000010,0 12px 18px #00000012;transition:transform .18s,box-shadow .18s,filter .18s;overflow:hidden}.vote-btn:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff40,transparent 52%);pointer-events:none}.vote-btn:active{transform:translateY(4px) scale(.98);box-shadow:0 3px 0 #00000012}.vote-btn:disabled{opacity:.7;cursor:wait}.vote-btn.agree{background:linear-gradient(145deg,#12b981,#078458);border-color:#55d6a7}.vote-btn.disagree{background:linear-gradient(145deg,#ff6875,#d9364b);border-color:#ff9ca5}.vote-emoji{font-size:25px;line-height:1;filter:drop-shadow(0 3px 3px #0002)}.vote-btn small{font-size:10px;font-weight:600;opacity:.9}
.result-block{margin:15px 0 0;animation:resultIn .45s ease both}.result-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;margin:12px 0 7px}.result-name{display:flex;align-items:center;gap:7px;color:var(--navy)}.result-value{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.bar-track{height:13px;border-radius:20px;background:#e9eef5;overflow:hidden;box-shadow:inset 0 2px 4px #0b24400d}.bar-fill{height:100%;width:0;border-radius:20px;position:relative;transition:width .85s cubic-bezier(.22,1,.36,1);overflow:hidden}.bar-fill:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 15%,#ffffff75 48%,transparent 75%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}.bar-fill.green{background:linear-gradient(90deg,#0b9b68,#35d49a)}.bar-fill.red{background:linear-gradient(90deg,#d9364b,#ff7a84)}.vote-done{display:flex;align-items:center;gap:8px;background:#ecfdf5;color:#087b50;border:1px solid #c6f3df;border-radius:12px;padding:10px 11px;font-size:11px;font-weight:800;margin-top:13px;animation:resultIn .35s ease both}.vote-done .check{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#c9f5df;font-size:14px;flex:0 0 24px}.hint{font-size:10px;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.5}.empty-state,.loading-state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px 16px;text-align:center;color:var(--muted);box-shadow:var(--shadow);font-size:12px;line-height:1.7}.empty-icon{font-size:34px;margin-bottom:8px}.error-state{color:#b42332}.footer-note{text-align:center;font-size:10px;color:#8190a3;padding:4px 15px 15px}
.swal2-container{z-index:100000!important}.swal2-popup{border-radius:22px!important}
@keyframes cardEnter{from{opacity:0;transform:perspective(900px) rotateX(7deg) translateY(22px) scale(.97)}to{opacity:1;transform:perspective(900px) rotateX(0) translateY(0) scale(1)}}
@keyframes resultIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #10b98120}50%{box-shadow:0 0 0 6px #10b98112}}
@keyframes shine{0%,35%{transform:translateX(-100%)}70%,100%{transform:translateX(120%)}}
@keyframes floatOrb{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-10px,9px,0)}}
@keyframes logoBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@media(hover:hover){.poll-card:hover{transform:translateY(-3px);box-shadow:0 17px 38px #082b541c}.vote-btn:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 10px 0 #0000000d,0 16px 22px #00000016}}
@media(max-width:360px){.container{padding:12px 9px}.poll-card{padding:15px 12px}.vote-options{gap:8px}.vote-btn{padding:13px 6px;font-size:13px}.poll-title{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="back-btn-wrap"><a href="index.html" onclick="return goBackHome(event)" class="custom-back-btn"><span>←</span> मुख्य पृष्ठ पर वापस जाएँ</a></div>
    <div class="brand"><div class="logo">📊</div><div><h1>जनमत पोल</h1><p>भुईहर जाति समाज · आपकी राय, समाज की आवाज़</p></div></div>
  </header>
  <section class="intro"><h2>समाज के विषयों पर अपनी राय दें</h2><p>हर सक्रिय पोल में एक बार मतदान करें। परिणाम लाइव अपडेट होंगे।</p></section>
  <main class="container"><div id="pollContainer"><div class="loading-state"><div class="empty-icon">📡</div>लाइव जनमत पोल लोड हो रहे हैं…</div></div></main>
  <div class="footer-note">भुईहर जाति समाज · जनमत पोल</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDc8P_DPoUUknLW9t7WY81i8-R4Fng04pA",authDomain:"bhuihar-jati-samaj.firebaseapp.com",projectId:"bhuihar-jati-samaj",storageBucket:"bhuihar-jati-samaj.firebasestorage.app",messagingSenderId:"144637993197",appId:"1:144637993197:web:a61f8d61ed932b9062ece4"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const POLL_OPTIONS=[{label:'सहमत',emoji:'👍',key:'agree',color:'green'},{label:'असहमत',emoji:'👎',key:'disagree',color:'red'}];
let unsubscribePolls=null;
function goBackHome(event){event.preventDefault();if(window.history.length>1){window.history.back();}else{window.location.href='index.html';}return false;}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function getLoggedMobile(){return (localStorage.getItem('userLoggedInMobile')||'').trim();}
function normalizeVotes(votes){const result={};if(votes&&typeof votes==='object'&&!Array.isArray(votes)){Object.entries(votes).forEach(([mobile,val])=>{if(val===0||val==='0'||val==='agree'||val==='सहमत')result[mobile]=0;else if(val===1||val==='1'||val==='disagree'||val==='असहमत')result[mobile]=1;});}return result;}
function renderPolls(snapshot){const container=document.getElementById('pollContainer');if(snapshot.empty){container.innerHTML='<div class="empty-state"><div class="empty-icon">🗳️</div><strong style="display:block;color:var(--navy);font-size:14px;margin-bottom:5px">अभी कोई सक्रिय जनमत पोल नहीं है</strong>नया पोल सक्रिय होने पर यहाँ दिखाई देगा।</div>';return;}
let html='';let visibleCount=0;const mobile=getLoggedMobile();
snapshot.forEach(doc=>{const p=doc.data()||{};if(p.status!=='active')return;visibleCount++;const votes=normalizeVotes(p.votes||{});const total=Object.keys(votes).length;const agreeCount=Object.values(votes).filter(v=>v===0).length;const disagreeCount=Object.values(votes).filter(v=>v===1).length;const hasVoted=!!mobile&&Object.prototype.hasOwnProperty.call(votes,mobile);const selected=hasVoted?votes[mobile]:null;const question=escapeHtml(p.question||'समाज से जुड़ा जनमत प्रश्न');const delay=Math.min((visibleCount-1)*80,400);
const voteButtons=hasVoted?'':`<div class="vote-options"><button type="button" class="vote-btn agree" data-poll="${escapeHtml(doc.id)}" data-choice="0"><span class="vote-emoji">👍</span><span>सहमत</span><small>मेरी राय हाँ में है</small></button><button type="button" class="vote-btn disagree" data-poll="${escapeHtml(doc.id)}" data-choice="1"><span class="vote-emoji">👎</span><span>असहमत</span><small>मेरी राय नहीं में है</small></button></div>`;
const results=hasVoted?`<div class="result-block"><div class="result-row"><span class="result-name">👍 सहमत ${selected===0?'<span aria-label="आपका मत">✓ आपका मत</span>':''}</span><span class="result-value">${agreeCount} वोट · ${total?Math.round(agreeCount/total*100):0}%</span></div><div class="bar-track"><div class="bar-fill green" style="width:${total?Math.round(agreeCount/total*100):0}%"></div></div><div class="result-row"><span class="result-name">👎 असहमत ${selected===1?'<span aria-label="आपका मत">✓ आपका मत</span>':''}</span><span class="result-value">${disagreeCount} वोट · ${total?Math.round(disagreeCount/total*100):0}%</span></div><div class="bar-track"><div class="bar-fill red" style="width:${total?Math.round(disagreeCount/total*100):0}%"></div></div></div><div class="vote-done"><span class="check">✓</span><span>आपका मत दर्ज है। लाइव परिणाम अपने-आप अपडेट होंगे।</span></div>`:'';
html+=`<article class="poll-card" style="animation-delay:${delay}ms"><div class="poll-top"><span class="live-label"><i class="live-dot"></i> LIVE POLL</span><span class="poll-number">पोल #${visibleCount}</span></div><h3 class="poll-title">${question}</h3><p class="poll-desc">नीचे दिए गए विकल्पों में से अपनी राय चुनें। मतदान के बाद परिणाम दिखाई देंगे।</p><div class="vote-count-line"><span>👥 कुल मतदान</span><strong data-total-for="${escapeHtml(doc.id)}">${total}</strong></div>${voteButtons}${results}<p class="hint">एक सदस्य · एक मत · लाइव काउंटिंग</p></article>`;
});
container.innerHTML=visibleCount?html:'<div class="empty-state"><div class="empty-icon">🗳️</div><strong style="display:block;color:var(--navy);font-size:14px;margin-bottom:5px">अभी कोई सक्रिय जनमत पोल नहीं है</strong>नया पोल सक्रिय होने पर यहाँ दिखाई देगा।</div>';
container.querySelectorAll('button[data-poll]').forEach(btn=>btn.addEventListener('click',()=>submitVote(btn.dataset.poll,Number(btn.dataset.choice),btn)));
}
function loadActivePolls(){const container=document.getElementById('pollContainer');try{if(unsubscribePolls)unsubscribePolls();unsubscribePolls=db.collection('polls').where('status','==','active').onSnapshot(renderPolls,error=>{console.error('Poll listener error:',error);container.innerHTML='<div class="empty-state error-state"><div class="empty-icon">⚠️</div><strong>पोल लोड नहीं हो पाए</strong><br>Firebase Firestore Rules और इंटरनेट कनेक्शन जाँचें।</div>';});}catch(error){console.error(error);container.innerHTML='<div class="empty-state error-state">Firebase शुरू नहीं हो पाया। कृपया पेज रीफ्रेश करें।</div>';}}
async function submitVote(pollId,choice,button){const mobile=getLoggedMobile();if(!mobile){Swal.fire({icon:'warning',title:'लॉगिन आवश्यक है',text:'जनमत पोल में वोट देने के लिए पहले लॉगिन करें।',confirmButtonColor:'#0757a3',confirmButtonText:'लॉगिन करें'}).then(result=>{if(result.isConfirmed)window.location.href='login.html';});return;}if(!/^[0-9]{10}$/.test(mobile)){Swal.fire({icon:'warning',title:'लॉगिन दोबारा करें',text:'आपका लॉगिन मोबाइल नंबर सही प्रारूप में नहीं है। कृपया लॉगआउट करके फिर लॉगिन करें।',confirmButtonColor:'#0757a3'});return;}if(choice!==0&&choice!==1)return;
if(button){button.disabled=true;button.style.filter='grayscale(.2)';}
try{const ref=db.collection('polls').doc(pollId);await db.runTransaction(async transaction=>{const snap=await transaction.get(ref);if(!snap.exists)throw new Error('यह पोल उपलब्ध नहीं है।');const data=snap.data()||{};if(data.status!=='active')throw new Error('यह पोल अब सक्रिय नहीं है।');const votes=normalizeVotes(data.votes||{});if(Object.prototype.hasOwnProperty.call(votes,mobile))throw new Error('आप इस पोल में पहले ही मतदान कर चुके हैं।');votes[mobile]=choice;transaction.update(ref,{votes:votes,options:Array.isArray(data.options)&&data.options.length?data.options:['सहमत','असहमत'],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});});await Swal.fire({icon:'success',title:'मतदान सफल!',text:'आपका मत दर्ज हो गया है। परिणाम अब लाइव दिखेंगे।',timer:1600,showConfirmButton:false});}catch(error){console.error('Vote error:',error);const already=String(error.message||'').includes('पहले ही');Swal.fire({icon:already?'info':'error',title:already?'मत पहले से दर्ज है':'मतदान नहीं हो पाया',text:error.message||'कृपया इंटरनेट कनेक्शन और Firestore Rules जाँचकर दोबारा कोशिश करें।',confirmButtonColor:'#0757a3'});}finally{if(button)button.disabled=false;}}
window.addEventListener('pagehide',()=>{if(unsubscribePolls){unsubscribePolls();unsubscribePolls=null;}});
loadActivePolls();
</script>
</body>
</html>
